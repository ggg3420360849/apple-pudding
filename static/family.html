<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹果布丁动物乐园 - 家庭版</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3f9a68">
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(180deg, #dff4ff 0%, #eff9f0 44%, #fff8e3 100%);
            min-height: 100vh;
            color: #1f2933;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 48px;
        }

        .logo h1 {
            font-size: 24px;
            color: #3f9a68;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .child-selector {
            padding: 10px 20px;
            border: 2px solid #3f9a68;
            border-radius: 10px;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 16px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .tab.active {
            background: #3f9a68;
            color: white;
        }

        .tab:hover {
            background: #e8f5ed;
        }

        .tab.active:hover {
            background: #2e7d52;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #3f9a68;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            color: white;
            text-align: center;
        }

        .stat-card.green {
            background: linear-gradient(135deg, #3f9a68 0%, #237351 100%);
        }

        .stat-card.blue {
            background: linear-gradient(135deg, #2678c7 0%, #1a5694 100%);
        }

        .stat-card.orange {
            background: linear-gradient(135deg, #f4c542 0%, #e09b1f 100%);
        }

        .stat-value {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .achievement-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .achievement-card.earned {
            border-color: #3f9a68;
            background: linear-gradient(135deg, #e8f5ed 0%, #d4ebe0 100%);
        }

        .achievement-card.locked {
            opacity: 0.5;
        }

        .achievement-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }

        .achievement-tier {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .tier-bronze { background: #cd7f32; color: white; }
        .tier-silver { background: #c0c0c0; color: #333; }
        .tier-gold { background: #ffd700; color: #333; }
        .tier-platinum { background: #e5e4e2; color: #333; }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3f9a68 0%, #2e7d52 100%);
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .calendar-day {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .calendar-day.active {
            background: #e8f5ed;
            border-color: #3f9a68;
        }

        .calendar-day.today {
            border-color: #2678c7;
            border-width: 3px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
        }

        .leaderboard-rank {
            font-size: 24px;
            font-weight: bold;
            color: #3f9a68;
            min-width: 40px;
            text-align: center;
        }

        .leaderboard-avatar {
            font-size: 32px;
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .leaderboard-stats {
            font-size: 14px;
            color: #61707d;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3f9a68;
            color: white;
        }

        .btn-primary:hover {
            background: #2e7d52;
        }

        .btn-secondary {
            background: #2678c7;
            color: white;
        }

        .btn-secondary:hover {
            background: #1a5694;
        }

        .share-preview {
            max-width: 400px;
            margin: 20px auto;
        }

        .share-preview img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3f9a68;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .offline-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f4c542;
            color: #333;
            padding: 10px 20px;
            border-radius: 10px;
            display: none;
        }

        .offline-indicator.active {
            display: block;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .achievements-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            .tabs {
                overflow-x: auto;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/styles/handdrawn.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🐼</div>
                <div>
                    <h1>苹果布丁动物乐园</h1>
                    <p style="color: #61707d; font-size: 14px;">家庭学习版</p>
                </div>
            </div>
            <div class="user-info">
                <select class="child-selector" id="childSelector">
                    <option value="">请选择孩子</option>
                </select>
                <button class="btn btn-primary" onclick="showAddChildModal()">➕ 添加孩子</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('dashboard')">📊 总览</button>
            <button class="tab" onclick="switchTab('achievements')">🏆 成就</button>
            <button class="tab" onclick="switchTab('calendar')">📅 日历</button>
            <button class="tab" onclick="switchTab('leaderboard')">👑 排行榜</button>
            <button class="tab" onclick="switchTab('share')">📤 分享</button>
            <button class="tab" onclick="switchTab('goals')">🎯 目标</button>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card green">
                    <div class="stat-label">已探索动物</div>
                    <div class="stat-value" id="animalsCount">0</div>
                    <div class="stat-label">种</div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-label">问题正确率</div>
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">总共 <span id="totalQuestions">0</span> 题</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-label">创作故事</div>
                    <div class="stat-value" id="storiesCount">0</div>
                    <div class="stat-label">个</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">学习连续</div>
                    <div class="stat-value" id="streak">0</div>
                    <div class="stat-label">天 🔥</div>
                </div>
            </div>

            <div class="card">
                <h2>🎖️ 已获得徽章</h2>
                <div id="earnedBadges">
                    <p style="color: #61707d;">暂无徽章，快去解锁成就吧！</p>
                </div>
            </div>
        </div>

        <!-- Achievements Tab -->
        <div id="achievements" class="tab-content">
            <div class="card">
                <h2>🏆 成就系统</h2>
                <p style="margin-bottom: 20px; color: #61707d;">完成任务解锁成就徽章</p>
                <div class="achievements-grid" id="achievementsList">
                    <div class="loading active">
                        <div class="spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calendar Tab -->
        <div id="calendar" class="tab-content">
            <div class="card">
                <h2>📅 本周学习日历</h2>
                <div class="calendar" id="calendarView">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <div class="card">
                <h2>📈 本周目标</h2>
                <div id="weeklyGoals">
                    <p style="color: #61707d;">暂无目标</p>
                </div>
            </div>
        </div>

        <!-- Leaderboard Tab -->
        <div id="leaderboard" class="tab-content">
            <div class="card">
                <h2>👑 家庭排行榜</h2>
                <div id="leaderboardList">
                    <p style="color: #61707d;">暂无数据</p>
                </div>
            </div>
        </div>

        <!-- Share Tab -->
        <div id="share" class="tab-content">
            <div class="card">
                <h2>📤 分享作品</h2>
                <p style="margin-bottom: 20px; color: #61707d;">生成精美卡片分享到社交媒体</p>

                <button class="btn btn-primary" style="margin-right: 10px;" onclick="generateAnimalCard()">
                    🎨 生成想象动物卡片
                </button>
                <button class="btn btn-secondary" onclick="generateStoryCard()">
                    📚 生成故事卡片
                </button>

                <div class="share-preview" id="sharePreview"></div>
            </div>

            <div class="card">
                <h2>🔗 邀请好友</h2>
                <p style="margin-bottom: 20px; color: #61707d;">扫描二维码邀请好友加入</p>
                <button class="btn btn-primary" onclick="generateQRCode()">生成邀请二维码</button>
                <div class="share-preview" id="qrCodePreview"></div>
            </div>
        </div>

        <!-- Goals Tab -->
        <div id="goals" class="tab-content">
            <div class="card">
                <h2>🎯 设置学习目标</h2>
                <div class="field">
                    <label>目标类型</label>
                    <select class="child-selector" id="goalType" style="width: 100%;">
                        <option value="explore_animals">探索动物</option>
                        <option value="answer_questions">回答问题</option>
                        <option value="create_stories">创作故事</option>
                    </select>
                </div>
                <div class="field">
                    <label>目标数量</label>
                    <input type="number" class="child-selector" id="goalTarget" style="width: 100%;" min="1" value="5">
                </div>
                <button class="btn btn-primary" onclick="createWeeklyGoal()">创建目标</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="addChildModal" class="modal">
        <div class="modal-content">
            <h2>➕ 添加孩子档案</h2>
            <div class="field">
                <label>姓名</label>
                <input type="text" id="childName" class="child-selector" style="width: 100%;" placeholder="请输入姓名">
            </div>
            <div class="field">
                <label>年龄</label>
                <input type="number" id="childAge" class="child-selector" style="width: 100%;" min="3" max="18" placeholder="请输入年龄">
            </div>
            <div class="field">
                <label>头像</label>
                <select id="childAvatar" class="child-selector" style="width: 100%;">
                    <option value="🦁">🦁 狮子</option>
                    <option value="🐼">🐼 熊猫</option>
                    <option value="🐯">🐯 老虎</option>
                    <option value="🐨">🐨 考拉</option>
                    <option value="🐰">🐰 兔子</option>
                    <option value="🐻">🐻 熊</option>
                    <option value="🦊">🦊 狐狸</option>
                    <option value="🐸">🐸 青蛙</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="addChild()" style="flex: 1;">确定</button>
                <button class="btn" onclick="closeModal()" style="flex: 1; background: #e0e0e0;">取消</button>
            </div>
        </div>
    </div>

    <div class="offline-indicator" id="offlineIndicator">
        ⚠️ 离线模式 - 数据将在联网后同步
    </div>

    <script src="/static/auth-fetch.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
