<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹果布丁动物乐园</title>
    <style>
        :root {
            --ink: #1f2933;
            --muted: #61707d;
            --line: #d9e5df;
            --paper: #fffdf7;
            --surface: #ffffff;
            --sky: #dff4ff;
            --green: #3f9a68;
            --green-dark: #237351;
            --blue: #2678c7;
            --blue-soft: #e4f4ff;
            --yellow: #f4c542;
            --coral: #ef7d61;
            --purple: #7b68b3;
            --shadow: 0 14px 34px rgba(36, 55, 69, 0.13);
            --radius: 8px;
            --bottom-nav-height: 74px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background:
                linear-gradient(180deg, #dff4ff 0, #eff9f0 44%, #fff8e3 100%);
            letter-spacing: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            max-width: 100%;
            min-width: 0;
        }

        button {
            border: 0;
        }

        .app-root {
            width: 420px;
            height: 85vh;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 26px;
        }

        .login-panel,
        .panel,
        .animal-tile,
        .metric,
        .collection-item,
        .story-item,
        .activity-item,
        .answer-panel {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(130, 157, 145, 0.28);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .story-title {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 16px 0;
            padding: 0;
            line-height: 1.5;
        }

        .login-panel {
            padding: 28px;
            align-self: center;
            max-width: 480px;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #ffe7a6;
            border: 1px solid #e9c769;
            font-size: 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.18;
        }

        .brand p {
            margin: 6px 0 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
            min-width: 0;
            max-width: 100%;
        }

        .field label,
        .section-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #243746;
        }

        .text-input,
        .select-input,
        .textarea-input {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: 46px;
            border: 1px solid #cbd9d3;
            border-radius: 8px;
            padding: 11px 12px;
            background: #ffffff;
            color: var(--ink);
            outline: none;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .textarea-input {
            min-height: 118px;
            resize: vertical;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-y: auto;
            overflow-x: hidden;
            text-overflow: clip;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .voice-input-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 48px;
            height: 48px;
            border: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            z-index: 2;
        }

        .voice-input-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .voice-input-btn:active,
        .voice-input-btn.recording {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .voice-status {
            margin-top: 12px;
            padding: 16px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 12px;
            text-align: center;
        }

        .voice-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-bottom: 12px;
        }

        .wave-bar {
            width: 4px;
            height: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 32px; }
        }

        #voiceStatusText {
            margin: 0;
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
        }

        .text-input:focus,
        .select-input:focus,
        .textarea-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(38, 120, 199, 0.16);
        }

        .role-grid,
        .chip-row,
        .model-row,
        .quick-grid,
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .role-option,
        .chip,
        .nav-item,
        .animal-chip,
        .choice-button,
        .tool-button {
            min-height: 42px;
            border-radius: 8px;
            border: 1px solid #cbd9d3;
            background: #ffffff;
            color: var(--ink);
            cursor: pointer;
            transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease;
        }

        .role-option {
            flex: 1 1 140px;
            padding: 12px;
            text-align: left;
        }

        .role-option strong {
            display: block;
            margin-bottom: 4px;
        }

        .role-option span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .role-option.active,
        .chip.active,
        .nav-item.active,
        .animal-chip.active,
        .choice-button.active {
            background: #e6f5ee;
            border-color: var(--green);
            color: var(--green-dark);
        }

        .animal-chip.locked {
            background: rgba(220, 220, 220, 0.4);
            border-color: rgba(180, 180, 180, 0.5);
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .animal-chip.locked:hover {
            transform: none;
            border-color: rgba(180, 180, 180, 0.5);
        }

        .primary-button,
        .secondary-button,
        .danger-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            min-width: 0;
            min-height: 46px;
            border-radius: 8px;
            padding: 0 16px;
            cursor: pointer;
            font-weight: 700;
            line-height: 1.25;
            overflow-wrap: anywhere;
            white-space: normal;
        }

        .primary-button {
            background: var(--green);
            color: #ffffff;
        }

        .primary-button:disabled {
            background: #9bbbad;
            cursor: not-allowed;
        }

        .secondary-button {
            background: #f8faf8;
            color: var(--green-dark);
            border: 1px solid #bbd3c5;
        }

        .danger-button {
            background: #fff2ed;
            color: #9f3b25;
            border: 1px solid #f0b49f;
        }

        .shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 238px minmax(0, 1fr);
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 20px 16px;
            background: rgba(255, 253, 247, 0.96);
            border-right: 1px solid rgba(118, 150, 134, 0.28);
            overflow: auto;
        }

        .mini-brand {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
        }

        .mini-brand .brand-mark {
            width: 42px;
            height: 42px;
            font-size: 23px;
        }

        .mini-brand strong {
            display: block;
            line-height: 1.25;
        }

        .mini-brand span {
            color: var(--muted);
            font-size: 12px;
        }

        .nav-list {
            display: grid;
            gap: 8px;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            text-align: left;
            background: transparent;
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            background: #eef6f1;
            font-size: 17px;
            flex: 0 0 auto;
        }

        .profile-box {
            margin-top: 18px;
            padding: 12px;
            background: #f6fbf8;
            border: 1px solid #d9e8df;
            border-radius: 8px;
        }

        .profile-name {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-meta {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .session-card {
            min-height: 56px;
            display: grid;
            grid-template-columns: 38px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #cbd9d3;
            background: #ffffff;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
        }

        .session-avatar {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #ffe7a6;
            font-size: 22px;
        }

        .session-name {
            display: block;
            font-weight: 700;
            line-height: 1.25;
        }

        .session-meta {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        .session-enter {
            color: var(--green-dark);
            font-size: 13px;
            font-weight: 700;
        }

        .main {
            min-width: 0;
            padding: 16px;
        }

        .topbar {
            display: flex;
            position: relative;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        .settings-button {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: 1px solid rgba(118, 150, 134, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: var(--muted);
            font-size: 20px;
            cursor: pointer;
            transition: all 150ms ease;
            box-shadow: 0 2px 4px rgba(36, 55, 69, 0.08);
        }

        .settings-button:hover {
            background: rgba(255, 255, 255, 1);
            border-color: var(--green);
            color: var(--green-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(36, 55, 69, 0.12);
        }

        .settings-button:active {
            transform: translateY(0);
        }

        .settings-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            z-index: 30;
            width: min(240px, calc(100vw - 32px));
            border-radius: 10px;
            border: 1px solid rgba(130, 157, 145, 0.2);
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(36, 55, 69, 0.12), 0 2px 6px rgba(36, 55, 69, 0.08);
            overflow: hidden;
        }

        .settings-menu-header {
            padding: 14px 16px 12px;
            border-bottom: 1px solid rgba(130, 157, 145, 0.12);
            background: rgba(248, 250, 248, 0.6);
        }

        .settings-menu-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-menu-body {
            padding: 14px 16px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.3;
        }

        .user-meta {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.4;
        }

        .settings-menu-footer {
            padding: 10px;
            border-top: 1px solid rgba(130, 157, 145, 0.12);
            background: rgba(248, 250, 248, 0.4);
        }

        .logout-button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid rgba(220, 53, 69, 0.2);
            border-radius: 6px;
            background: #ffffff;
            color: #dc3545;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 120ms ease;
        }

        .logout-button:hover {
            background: rgba(220, 53, 69, 0.08);
            border-color: rgba(220, 53, 69, 0.4);
            transform: translateY(-1px);
        }

        .logout-button:active {
            transform: translateY(0);
        }

        .logout-button svg {
            flex: 0 0 auto;
            opacity: 0.85;
        }

        .page-title h2 {
            margin: 0;
            font-size: 26px;
            line-height: 1.25;
        }

        .page-title p {
            margin: 5px 0 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .view {
            display: grid;
            gap: 16px;
            min-width: 0;
            max-width: 100%;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            align-items: start;
            min-width: 0;
            max-width: 100%;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            min-width: 0;
            max-width: 100%;
        }

        .panel {
            padding: 16px;
            min-width: 0;
            max-width: 100%;
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
            min-width: 0;
        }

        .panel-title h3 {
            margin: 0;
            font-size: 18px;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .panel-title span {
            color: var(--muted);
            font-size: 13px;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .map-canvas {
            position: relative;
            min-height: 470px;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #b9d6cd;
            background:
                linear-gradient(180deg, #cfefff 0 27%, #f5f5cf 27% 100%);
        }

        .map-canvas::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(145deg, transparent 0 44%, rgba(44, 137, 92, 0.18) 44% 46%, transparent 46% 100%),
                linear-gradient(18deg, transparent 0 58%, rgba(38, 120, 199, 0.18) 58% 63%, transparent 63% 100%);
            pointer-events: none;
        }

        .biome {
            position: absolute;
            border-radius: 8px;
            border: 1px solid rgba(45, 78, 65, 0.12);
            box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.04);
        }

        .biome.forest {
            left: -4%;
            top: 30%;
            width: 38%;
            height: 48%;
            background: #89c877;
            clip-path: polygon(0 10%, 80% 0, 100% 70%, 38% 100%, 0 82%);
        }

        .biome.mountain {
            left: 22%;
            top: 21%;
            width: 30%;
            height: 40%;
            background: #b6c3b6;
            clip-path: polygon(4% 78%, 34% 8%, 54% 51%, 73% 16%, 100% 83%);
        }

        .biome.grassland {
            left: 39%;
            top: 44%;
            width: 34%;
            height: 36%;
            background: #c8d96f;
            clip-path: polygon(4% 22%, 92% 0, 100% 86%, 7% 100%);
        }

        .biome.ocean {
            right: -5%;
            top: 32%;
            width: 39%;
            height: 54%;
            background: #75c9da;
            clip-path: polygon(18% 0, 100% 0, 100% 100%, 5% 84%, 0 30%);
        }

        .biome.wetland {
            left: 19%;
            bottom: -4%;
            width: 36%;
            height: 30%;
            background: #96c7a6;
            clip-path: polygon(0 18%, 86% 0, 100% 68%, 8% 100%);
        }

        .biome.polar {
            right: 4%;
            top: 8%;
            width: 31%;
            height: 28%;
            background: #f3fbff;
            clip-path: polygon(0 40%, 27% 8%, 58% 28%, 100% 0, 96% 88%, 8% 100%);
        }

        .biome.desert {
            left: 53%;
            bottom: 2%;
            width: 28%;
            height: 27%;
            background: #eecb74;
            clip-path: polygon(0 18%, 68% 0, 100% 56%, 20% 100%);
        }

        .map-label {
            position: absolute;
            padding: 5px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(104, 132, 120, 0.24);
            color: #355244;
            font-size: 13px;
            font-weight: 700;
        }

        .marker {
            position: absolute;
            width: 82px;
            min-height: 82px;
            padding: 7px 5px;
            display: grid;
            place-items: center;
            gap: 2px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid rgba(255, 255, 255, 0.94);
            color: var(--ink);
            box-shadow: 0 10px 22px rgba(34, 63, 73, 0.16);
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .marker.locked {
            background: rgba(200, 200, 200, 0.5);
            border-color: rgba(150, 150, 150, 0.6);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .marker.locked .animal-face {
            filter: grayscale(100%);
            opacity: 0.4;
        }

        .marker.locked .animal-name {
            color: #888;
        }

        .marker.almost-unlocked {
            border-color: var(--green);
            box-shadow: 0 10px 22px rgba(63, 154, 104, 0.3), 0 0 0 2px rgba(63, 154, 104, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 22px rgba(63, 154, 104, 0.3), 0 0 0 2px rgba(63, 154, 104, 0.2);
            }
            50% {
                box-shadow: 0 10px 22px rgba(63, 154, 104, 0.5), 0 0 0 4px rgba(63, 154, 104, 0.3);
            }
        }

        .lock-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #cbd9d3 0%, #9fb3a8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .unlock-progress {
            position: absolute;
            bottom: 2px;
            left: 5px;
            right: 5px;
            height: 4px;
            background: rgba(200, 200, 200, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .unlock-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--green) 0%, #5cb85c 100%);
            transition: width 0.3s ease;
        }

        .unlock-hint {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .marker.locked:hover .unlock-hint {
            opacity: 1;
        }

        .marker.active {
            border-color: var(--coral);
            background: #fff3ec;
        }

        .marker .animal-face {
            font-size: 30px;
            line-height: 1;
        }

        .marker .animal-name {
            font-weight: 700;
            font-size: 13px;
            line-height: 1.15;
            text-align: center;
        }

        .animal-summary {
            display: grid;
            gap: 12px;
        }

        .animal-hero {
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
        }

        .animal-avatar {
            width: 78px;
            height: 78px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #fff0c8;
            border: 1px solid #ecd48d;
            font-size: 42px;
        }

        .animal-hero h3 {
            margin: 0 0 6px;
            font-size: 24px;
        }

        .animal-hero p,
        .detail-list p {
            margin: 0;
            color: var(--muted);
            line-height: 1.65;
        }

        .detail-list {
            display: grid;
            gap: 10px;
        }

        .detail-list strong {
            color: var(--ink);
        }

        .animal-grid {
            display: grid;

        .wing.bat {
            background:

        .route-imagine .tail {
            width: 82px;
            height: 52px;
            right: 8px;

        .tail.curl::before {

            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.54);
            border-left-color: transparent;

        .tail.curl::after {

        /* 备用问题行样式 */
        .quick-question-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quick-question-text {
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
            padding: 14px 16px;
            border: 1px solid rgba(118, 150, 134, 0.25);
            border-radius: 8px;
            background: #ffffff;
            color: var(--ink);
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            cursor: pointer;
            transition: all 120ms ease;
            white-space: normal;
            word-break: break-word;
            box-shadow: 0 2px 4px rgba(36, 55, 69, 0.08);
        }

        .quick-question-text:hover:not(:disabled) {
            background: rgba(63, 154, 104, 0.08);
            border-color: var(--green);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(63, 154, 104, 0.2);
        }

        .quick-question-text:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .refresh-question-btn {
            flex: 0 0 auto;
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(118, 150, 134, 0.3);
            border-radius: 8px;
            background: #ffffff;
            font-size: 20px;
            cursor: pointer;
            transition: all 120ms ease;
            box-shadow: 0 2px 4px rgba(36, 55, 69, 0.08);
        }

        .refresh-question-btn:hover:not(:disabled) {
            background: rgba(63, 154, 104, 0.1);
            border-color: var(--green);
            transform: rotate(90deg);
            box-shadow: 0 4px 12px rgba(63, 154, 104, 0.2);
        }

        .refresh-question-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-question-btn.loading {
            animation: rotate 1s linear infinite;
        }

        /* 生成中的问题文本动画 */
        .quick-question-text.generating::after {
            content: '';
            animation: ellipsis 1.5s infinite;
        }

        @keyframes ellipsis {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        @keyframes fillHighlight {
            0%, 100% { background: #ffffff; }
            50% { background: rgba(63, 154, 104, 0.1); }
        }

        .textarea-input.filled {
            animation: fillHighlight 300ms ease;
        }

        .hide {
            display: none !important;

            line-height: 1.25;
            white-space: normal;
            overflow-wrap: anywhere;
            text-align: center;
            justify-content: center;
        }

        .quick-grid .chip {
            text-align: left;
            justify-content: flex-start;
        }

        .map-canvas {
            min-height: 315px;
        }

        .map-label {
            display: none;
        }

        .marker {
            width: 54px;
            min-height: 54px;
            padding: 4px 3px;
            border-width: 1px;
            box-shadow: 0 6px 14px rgba(34, 63, 73, 0.14);
        }

        .marker .animal-face {
            font-size: 23px;
        }

        .marker .animal-name {
            font-size: 10px;
        }

        .animal-hero {
            grid-template-columns: 62px minmax(0, 1fr);
            gap: 10px;
        }

        .animal-avatar {
            width: 62px;
            height: 62px;
            font-size: 34px;
        }

        .animal-hero h3 {
            font-size: 20px;
        }

        .animal-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .animal-tile {
            padding: 10px;
            box-shadow: 0 6px 16px rgba(36, 55, 69, 0.08);
        }

        .animal-tile h4 {
            margin: 6px 0 4px;
            font-size: 15px;
        }

        .animal-tile p {
            font-size: 12px;
            line-height: 1.35;
        }

        .answer-panel {
            min-height: 118px;
            font-size: 14px;
            line-height: 1.7;
        }

        #storyAnswer {
            padding: 0 12px 12px 12px;
            min-height: 60px;
        }

        .imagine-stage {
            min-height: 220px;
        }

        .creature-preview {
            width: min(230px, 90%);
        }

        .metric {
            padding: 12px;
        }

        .metric strong {
            font-size: 24px;
        }

        .bar-row {
            grid-template-columns: 64px minmax(0, 1fr) 34px;
            gap: 8px;
            font-size: 13px;
        }

        .toast {
            position: absolute;
            bottom: calc(var(--bottom-nav-height) + 14px + env(safe-area-inset-bottom));
            max-width: min(390px, calc(100vw - 24px));
        }

        /* 移动端备用问题行样式 */
        .quick-question-row {
            gap: 8px;
        }

        .quick-question-text {
            font-size: 15px;
            font-weight: 500;
            padding: 12px 14px;
        }

        .refresh-question-btn {
            width: 42px;
            height: 42px;
            font-size: 18px;
        }

        .main.route-imagine {
            padding: 0 0 calc(var(--bottom-nav-height) + env(safe-area-inset-bottom));
        }

        /* 家长端报告增强样式 */
        .report-bottom-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid rgba(118, 150, 134, 0.28);
        }

        .report-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            background: #f8faf8;
            border: 1px solid #cbd9d3;
            border-radius: 8px;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .report-nav-item:hover {
            background: rgba(63, 154, 104, 0.08);
            border-color: var(--green);
        }

        .report-nav-item.active {
            color: var(--green);
            background: rgba(63, 154, 104, 0.12);
            border-color: var(--green);
        }

        .report-nav-icon {
            font-size: 28px;
        }

        .report-nav-label {
            font-size: 13px;
            font-weight: 500;
        }

        .report-content-wrapper {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(130, 157, 145, 0.28);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }

        .report-content {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }

        .trend-chart {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            height: 180px;
            align-items: end;
            padding: 10px 0;
        }

        .trend-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .bar {
            width: 100%;
            min-height: 20px;
            background: linear-gradient(180deg, var(--green), var(--green-dark));
            border-radius: 4px 4px 0 0;
            display: flex;
            align-items: start;
            justify-content: center;
            padding-top: 4px;
            transition: all 0.3s ease;
        }

        .bar:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(63, 154, 104, 0.3);
        }

        .bar-value {
            color: white;
            font-size: 11px;
            font-weight: 700;
        }

        .bar-label {
            font-size: 11px;
            color: var(--muted);
        }

        .time-distribution {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .time-period-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8fbf8;
            border-radius: 8px;
            border: 1px solid var(--line);
        }

        .period-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .period-label {
            font-size: 13px;
            color: var(--muted);
        }

        .period-count {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .achievement-badge {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #cbd9d3;
            background: #f8fbf8;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .achievement-badge.unlocked {
            background: linear-gradient(135deg, #e6f5ee 0%, #fff8e3 100%);
            border-color: var(--green);
            box-shadow: 0 4px 12px rgba(63, 154, 104, 0.2);
        }

        .achievement-badge.locked {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .badge-icon {
            font-size: 32px;
            flex-shrink: 0;
        }

        .badge-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .badge-info strong {
            font-size: 14px;
            line-height: 1.2;
        }

        .badge-info span {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.3;
        }

        .learning-profile {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .profile-item {
            display: flex;
            gap: 12px;
            align-items: start;
            padding: 12px;
            background: #f8fbf8;
            border-radius: 8px;
            border: 1px solid var(--line);
        }

        .profile-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .profile-item strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .profile-item p {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        @media (min-width: 431px) {
            body {
                display: grid;
                place-items: center;
                height: 100dvh;
                padding: 16px 0;
            }

            .app-root {
                height: min(100dvh - 32px, 932px);
                border-radius: 18px;
                overflow: hidden;
            }
        }

        @media print {
            body {
                background: #ffffff;
            }

            .sidebar,
            .topbar .action-row,
            .report-bottom-nav,
            .no-print {
                display: none !important;
            }

            .report-content {
                max-height: none !important;
                overflow: visible !important;
            }

            .report-content-wrapper {
                box-shadow: none;
                border: none;
            }

            .shell {
                display: block;
            }

            .main {
                padding: 0;
            }

            .panel,
            .metric,
            .activity-item {
                box-shadow: none;
            }
        }

        /* Animal School New Design Styles */
        .animal-selection-view {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 20px;
        }

        .selection-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .selection-title {
            font-size: 28px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 32px 0;
        }

        .animal-selection-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .animal-selection-item {
            width: 100%;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid rgba(130, 157, 145, 0.28);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(36, 55, 69, 0.08);
        }

        .animal-selection-item:hover {
            transform: translateY(-2px);
            border-color: var(--green);
            box-shadow: 0 8px 20px rgba(36, 55, 69, 0.12);
        }

        .selection-icon {
            font-size: 48px;
            line-height: 1;
        }

        .selection-name {
            font-size: 22px;
            font-weight: 500;
            color: var(--ink);
        }

        /* Loading Animation */
        .animal-loading-view {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 20px;
        }

        .loading-container {
            text-align: center;
        }

        .loading-animal {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .animal-large-icon {
            font-size: 120px;
            line-height: 1;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .animal-action-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 32px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-text {
            font-size: 20px;
            color: var(--ink);
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        .loading-subtext {
            font-size: 16px;
            color: var(--muted);
            margin: 0;
        }

        /* Specific animal animations */
        .panda-animation .animal-large-icon {
            animation: eating 2s ease-in-out infinite;
        }

        @keyframes eating {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .dolphin-animation .animal-action-indicator {
            animation: bubble 2s ease-in-out infinite;
        }

        @keyframes bubble {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
        }

        .elephant-animation .animal-large-icon {
            animation: doze 3s ease-in-out infinite;
        }

        @keyframes doze {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.95); }
        }

        .penguin-animation .animal-large-icon {
            animation: waddle 1s ease-in-out infinite;
        }

        @keyframes waddle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }

        .tiger-animation .animal-large-icon {
            animation: run 0.8s ease-in-out infinite;
        }

        @keyframes run {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        .rabbit-animation .animal-large-icon {
            animation: chew 1.5s ease-in-out infinite;
        }

        @keyframes chew {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.95); }
        }

        .camel-animation .animal-large-icon {
            animation: walk 2s ease-in-out infinite;
        }

        @keyframes walk {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-5px) translateY(-3px); }
            75% { transform: translateX(5px) translateY(-3px); }
        }

        .frog-animation .animal-large-icon {
            animation: hop 1.2s ease-in-out infinite;
        }

        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Demonstration animations (for correct answer display) */
        .panda-demonstration .animal-large-icon {
            animation: eating 2s ease-in-out infinite;
        }

        .dolphin-demonstration .animal-large-icon {
            animation: pulse 2s ease-in-out infinite;
        }

        .elephant-demonstration .animal-large-icon {
            animation: drinking 2s ease-in-out infinite;
        }

        @keyframes drinking {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(-10deg); }
        }

        .penguin-demonstration .animal-large-icon {
            animation: swim 2s ease-in-out infinite;
        }

        @keyframes swim {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }

        .tiger-demonstration .animal-large-icon {
            animation: stealth 2s ease-in-out infinite;
        }

        @keyframes stealth {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        .rabbit-demonstration .animal-large-icon {
            animation: listen 2s ease-in-out infinite;
        }

        @keyframes listen {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }

        .camel-demonstration .animal-large-icon {
            animation: walk 2s ease-in-out infinite;
        }

        @keyframes walk {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-8px); }
            75% { transform: translateY(-4px); }
        }

        .frog-demonstration .animal-large-icon {
            animation: transform-grow 2s ease-in-out infinite;
        }

        @keyframes transform-grow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Animal Care View */
        .animal-care-view {
            padding-bottom: 20px;
            max-width: 100%;
            overflow-x: hidden;
        }

        .care-header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
            max-width: 100%;
        }

        .animal-display {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 100%;
            min-height: 200px;
        }

        .animal-large {
            font-size: 80px;
            line-height: 1;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
            position: relative;
            z-index: 2;
        }

        .animal-large:hover {
            transform: scale(1.1);
        }

        .animal-display.sad .animal-large {
            filter: grayscale(0.3);
            animation: shake 0.5s ease-in-out infinite;
        }

        /* 状态描述文字 */
        .animal-state-description {
            margin-top: 16px;
            font-size: 16px;
            color: var(--ink);
            font-weight: 600;
            text-align: center;
            min-height: 24px;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(240, 248, 255, 0.9) 100%);
            border-radius: 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            }
        }

        /* 互动提示 */
        .animal-click-hint {
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            animation: hintPulse 2s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }

        /* 飘浮的emoji */
        .floating-emoji {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            z-index: 1;
            animation: float-up 3s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5);
            }
            10% {
                opacity: 1;
                transform: translateY(-5px) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(0.8);
            }
        }

        /* 状态特效容器 */
        .state-effects {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* 动物状态动画 */
        .animal-large.state-sleeping {
            animation: sleeping 2s ease-in-out infinite;
        }

        @keyframes sleeping {
            0%, 100% { transform: rotate(-5deg) scale(0.95); }
            50% { transform: rotate(-5deg) scale(1); }
        }

        .animal-large.state-reading {
            animation: reading 3s ease-in-out infinite;
        }

        @keyframes reading {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }

        .animal-large.state-hungry {
            animation: hungry 0.8s ease-in-out infinite;
        }

        @keyframes hungry {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.05) translateY(-3px); }
            50% { transform: scale(1); }
            75% { transform: scale(1.05) translateY(-3px); }
        }

        .animal-large.state-climbing {
            animation: climbing 2s ease-in-out infinite;
        }

        @keyframes climbing {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }

        .animal-large.state-playing {
            animation: playing 1s ease-in-out infinite;
        }

        @keyframes playing {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(10deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.1); }
        }

        .animal-large.state-exercising {
            animation: exercising 0.6s ease-in-out infinite;
        }

        @keyframes exercising {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        .animal-large.state-curious {
            animation: curious 2s ease-in-out infinite;
        }

        @keyframes curious {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .animal-large.state-dancing {
            animation: dancing 0.8s ease-in-out infinite;
        }

        @keyframes dancing {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-5px) rotate(-5deg); }
        }

        .animal-large.state-relaxing {
            animation: relaxing 4s ease-in-out infinite;
        }

        @keyframes relaxing {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(5deg); }
        }

        .animal-large.state-snacking {
            animation: snacking 1.5s ease-in-out infinite;
        }

        @keyframes snacking {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.9); }
        }

        .animal-large.state-rolling {
            animation: rolling 2s ease-in-out infinite;
        }

        @keyframes rolling {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(90deg); }
            50% { transform: rotate(180deg); }
            75% { transform: rotate(270deg); }
            100% { transform: rotate(360deg); }
        }

        .animal-state-hint {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            animation: bounceIn 3s ease-in-out;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(10px) scale(0.8);
            }
            10% {
                opacity: 1;
                transform: translateX(-50%) translateY(-5px) scale(1.1);
            }
            15% {
                transform: translateX(-50%) translateY(0) scale(1);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px) scale(0.9);
            }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        .doctor-help-button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
            animation: attention 2s ease-in-out infinite;
        }

        @keyframes attention {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6); }
        }

        .doctor-help-button:hover {
            transform: scale(1.15);
        }

        .help-icon {
            font-size: 20px;
            filter: brightness(0) invert(1);
        }

        .animal-info-card {
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid rgba(130, 157, 145, 0.28);

    function clone(value) {
        return JSON.parse(JSON.stringify(value));
    }

    function loadSessionStore() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
            if (saved && saved.sessions) return saved;

            const legacy = JSON.parse(localStorage.getItem(LEGACY_STORE_KEY) || "null");
            if (legacy && legacy.profile) {
                const id = legacy.sessionId || makeSessionId();
                const migrated = mergeState(clone(defaultState), legacy);
                migrated.sessionId = id;
                const store = { sessions: { [id]: migrated }, order: [id] };
                localStorage.setItem(STORE_KEY, JSON.stringify(store));
                sessionStorage.setItem(ACTIVE_SESSION_KEY, id);
                return store;
            }

            return { sessions: {}, order: [] };
        } catch (error) {
            console.error('Failed to load session store:', error);
            // 清除损坏的数据
            try {
                localStorage.removeItem(STORE_KEY);
                localStorage.removeItem(LEGACY_STORE_KEY);
            } catch (cleanupError) {
                console.error('Failed to cleanup corrupted data:', cleanupError);
            }
            return { sessions: {}, order: [] };
        }
    }

        return clone(defaultState);

        const merged = { ...base, ...saved };
        merged.progress = { ...base.progress, ...(saved.progress || {}) };
        merged.draftCreature = { ...base.draftCreature, ...(saved.draftCreature || {}) };
        merged.animalUnlocks = { ...base.animalUnlocks, ...(saved.animalUnlocks || {}) };
        return merged;
    }

    function saveState() {
        if (!state.sessionId) return;

        try {
            const persisted = clone(state);
            delete persisted.settingsOpen;
            sessionStore.sessions[state.sessionId] = mergeState(clone(defaultState), persisted);
            sessionStore.order = [state.sessionId, ...sessionStore.order.filter((id) => id !== state.sessionId)];

            const storeData = JSON.stringify(sessionStore);

            // 检查localStorage容量（5MB限制）
            const sizeInBytes = new Blob([storeData]).size;
            const sizeInMB = (sizeInBytes / (1024 * 1024)).toFixed(2);

            // 如果超过4MB，自动清理旧数据
            if (sizeInBytes > 4 * 1024 * 1024) {
                console.warn(`localStorage使用量: ${sizeInMB}MB，接近5MB限制，开始清理...`);

                // 按最后更新时间排序会话，保留最新的
                const sortedSessions = sessionStore.order
                    .map(id => ({
                        id,
                        lastUpdate: sessionStore.sessions[id]?.progress?.activities?.[0]?.time || 0
                    }))
                    .sort((a, b) => b.lastUpdate - a.lastUpdate);

                // 删除最旧的30%会话（至少保留3个）
                const keepCount = Math.max(3, Math.ceil(sortedSessions.length * 0.7));
                const toDelete = sortedSessions.slice(keepCount);

                toDelete.forEach(s => delete sessionStore.sessions[s.id]);
                sessionStore.order = sortedSessions.slice(0, keepCount).map(s => s.id);

                showToast(`已清理${toDelete.length}个旧会话以释放空间`);
            }

            localStorage.setItem(STORE_KEY, JSON.stringify(sessionStore));
            sessionStorage.setItem(ACTIVE_SESSION_KEY, state.sessionId);
        } catch (error) {
            console.error("保存状态失败:", error);

            // 如果是容量超限错误
            if (error.name === 'QuotaExceededError') {
                // 尝试清理旧会话
                if (sessionStore.order.length > 1) {
                    const oldestSession = sessionStore.order[sessionStore.order.length - 1];
                    delete sessionStore.sessions[oldestSession];
                    sessionStore.order = sessionStore.order.slice(0, -1);

                    // 再次尝试保存
                    try {
                        localStorage.setItem(STORE_KEY, JSON.stringify(sessionStore));
                        showToast("已清理旧数据并保存");
                    } catch (retryError) {
                        showToast("存储空间不足，请导出数据后清空记录");
                    }
                } else {
                    showToast("存储空间不足，请清空部分记录");
                }
            } else {
                showToast("保存失败，请重试");
            }
        }
    }

    // ========== 解锁系统核心函数 ==========

    /**
     * 检查动物是否解锁
     */
    function isAnimalUnlocked(animalId) {
        return state.animalUnlocks[animalId]?.unlocked || false;
    }

    /**
     * 获取已解锁的动物列表
     */
    function getUnlockedAnimals() {
        return animals.filter(a => isAnimalUnlocked(a.id));
    }

    /**
     * 获取未解锁的动物列表
     */
    function getLockedAnimals() {
        return animals.filter(a => !isAnimalUnlocked(a.id));
    }

    /**
     * 检查解锁条件是否满足
     */
    function checkUnlockConditions(animal) {
        const { type, conditions } = animal.unlockRequirements;

        if (type === "initial") {
            return true;
        }

        return conditions.every(condition => {
            switch (condition.stat) {
                case "animalInteraction":
                    const targetAnimal = state.animalUnlocks[condition.target];
                    return targetAnimal && targetAnimal.interactionCount >= condition.count;

                case "totalQuestions":
                    return state.progress.totalQuestions >= condition.count;

                case "quickQA":
                    const qaAnimal = state.animalUnlocks[condition.target];
                    return qaAnimal && qaAnimal.quickQACount >= condition.count;

                case "totalChats":
                    return state.progress.totalChats >= condition.count;

                case "uniqueAnimals":
                    return state.progress.uniqueAnimalsInteracted.length >= condition.count;

                case "storiesCompleted":
                    return state.progress.storiesCompleted >= condition.count;

                case "quizPassed":
                    return state.progress.totalQuizPassed >= condition.count;

                case "unlockedAnimals":
                    return getUnlockedAnimals().length >= condition.count;

                case "totalStories":
                    return state.progress.totalStories >= condition.count;

                case "allQuizPassed":
                    const unlockedCount = getUnlockedAnimals().length;
                    const passedCount = Object.values(state.animalUnlocks)
                        .filter(a => a.unlocked && a.quizPassed).length;
                    return condition.value && passedCount >= unlockedCount - 1;

                default:
                    return false;
            }
        });
    }

    /**
     * 计算解锁进度
     */
    function calculateUnlockProgress(animal) {
        const { type, conditions } = animal.unlockRequirements;

        if (type === "initial") {
            return { current: 1, required: 1, percentage: 100 };
        }

        if (conditions.length === 0) {
            return { current: 0, required: 1, percentage: 0 };
        }

        // 对于多条件，计算平均进度
        const progresses = conditions.map(condition => {
            let current = 0;
            let required = 0;

            switch (condition.stat) {
                case "animalInteraction":
                    const targetAnimal = state.animalUnlocks[condition.target];
                    current = targetAnimal?.interactionCount || 0;
                    required = condition.count;
                    break;

                case "totalQuestions":
                    current = state.progress.totalQuestions;
                    required = condition.count;
                    break;

                case "quickQA":
                    const qaAnimal = state.animalUnlocks[condition.target];
                    current = qaAnimal?.quickQACount || 0;
                    required = condition.count;
                    break;

                case "totalChats":
                    current = state.progress.totalChats;
                    required = condition.count;
                    break;

                case "uniqueAnimals":
                    current = state.progress.uniqueAnimalsInteracted.length;
                    required = condition.count;
                    break;

                case "storiesCompleted":
                    current = state.progress.storiesCompleted;
                    required = condition.count;
                    break;

                case "quizPassed":
                    current = state.progress.totalQuizPassed;
                    required = condition.count;
                    break;

                case "unlockedAnimals":
                    current = getUnlockedAnimals().length;
                    required = condition.count;
                    break;

                case "totalStories":
                    current = state.progress.totalStories;
                    required = condition.count;
                    break;

                case "allQuizPassed":
                    const unlockedCount = getUnlockedAnimals().length;
                    const passedCount = Object.values(state.animalUnlocks)
                        .filter(a => a.unlocked && a.quizPassed).length;
                    current = passedCount;
                    required = Math.max(1, unlockedCount - 1);
                    break;
            }

            return {
                current: Math.min(current, required),
                required: required,
                percentage: required > 0 ? Math.floor((Math.min(current, required) / required) * 100) : 0
            };
        });

        // 返回平均进度
        const avgPercentage = Math.floor(
            progresses.reduce((sum, p) => sum + p.percentage, 0) / progresses.length
        );

        return {
            current: progresses[0].current,
            required: progresses[0].required,
            percentage: avgPercentage,
            details: progresses
        };
    }

    /**
     * 检查并触发解锁
     */
    function checkAndUnlockAnimals() {
        const newUnlocks = [];

        animals.forEach(animal => {
            if (!isAnimalUnlocked(animal.id) && checkUnlockConditions(animal)) {
                // 解锁动物
                state.animalUnlocks[animal.id] = {
                    unlocked: true,
                    unlockedAt: new Date().toISOString(),
                    interactionCount: 0,
                    quizPassed: false,
                    quickQACount: 0
                };
                newUnlocks.push(animal);
            }
        });

        if (newUnlocks.length > 0) {
            saveState();
            // 触发解锁动画
            newUnlocks.forEach(animal => {
                triggerUnlockAnimation(animal);
            });
        }

        return newUnlocks;
    }

    /**
     * 触发解锁动画和提示
     */
    function triggerUnlockAnimation(animal) {
        // 创建解锁提示
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px 48px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
            z-index: 10000;
            text-align: center;
            animation: unlockPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        `;

        notification.innerHTML = `
            <div style="font-size: 64px; margin-bottom: 16px;">${animal.icon}</div>
            <div style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">解锁新动物！</div>
            <div style="font-size: 18px; opacity: 0.95;">${animal.name}</div>
            <div style="font-size: 14px; opacity: 0.8; margin-top: 12px;">${animal.habitat}</div>
        `;

        document.body.appendChild(notification);

        // 添加动画样式
        if (!document.getElementById('unlock-animation-style')) {
            const style = document.createElement('style');
            style.id = 'unlock-animation-style';
            style.textContent = `
                @keyframes unlockPop {
                    0% {
                        transform: translate(-50%, -50%) scale(0.5);
                        opacity: 0;
                    }
                    50% {
                        transform: translate(-50%, -50%) scale(1.1);
                    }
                    100% {
                        transform: translate(-50%, -50%) scale(1);
                        opacity: 1;
                    }
                }
                @keyframes unlockFadeOut {
                    to {
                        opacity: 0;
                        transform: translate(-50%, -50%) scale(0.9);
                    }
                }
            `;
            document.head.appendChild(style);
        }

        // 3秒后淡出消失
        setTimeout(() => {
            notification.style.animation = 'unlockFadeOut 0.3s ease-out forwards';
            setTimeout(() => {
                notification.remove();
            }, 300);
        }, 3000);

        // 显示Toast提示
        showToast(`🎉 解锁了新动物：${animal.name}！`);
    }

    /**
     * 更新互动统计
     */
    function updateInteractionStats(animalId, type) {
        // 初始化动物解锁记录
        if (!state.animalUnlocks[animalId]) {
            state.animalUnlocks[animalId] = {
                unlocked: false,
                interactionCount: 0,
                quizPassed: false,
                quickQACount: 0
            };
        }

        // 更新统计
        switch (type) {
            case "chat":
                state.progress.totalChats++;
                state.animalUnlocks[animalId].interactionCount++;
                if (!state.progress.uniqueAnimalsInteracted.includes(animalId)) {
                    state.progress.uniqueAnimalsInteracted.push(animalId);
                }
                break;

            case "question":
                state.progress.totalQuestions++;
                break;

            case "quickQA":
                state.animalUnlocks[animalId].quickQACount++;
                break;

            case "quizPassed":
                state.progress.totalQuizPassed++;
                state.animalUnlocks[animalId].quizPassed = true;
                break;

            case "storyGenerated":
                state.progress.totalStories++;
                break;

            case "storyCompleted":
                state.progress.storiesCompleted++;
                break;
        }

        saveState();
        checkAndUnlockAnimals();
    }

    function makeSessionId() {
        return `session_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function createSession(profile) {
        const id = makeSessionId();
        state = mergeState(clone(defaultState), {
            sessionId: id,
            profile,
            route: profile.role === "parent" ? "report-overview" : "map"
        });
        addActivity("登录", `${roleLabel(profile.role)} ${profile.name}`);
        saveState();
    }

    function switchSession(id) {
        if (!sessionStore.sessions[id]) return;
        sessionStorage.setItem(ACTIVE_SESSION_KEY, id);
        state = loadState();
        // 验证当前路由是否对该角色可用
        validateAndFixRoute();
        render();
    }

    function validateAndFixRoute() {
        if (!state.profile) return;
        const availableRoutes = getAvailableRoutes();
        const currentRouteValid = availableRoutes.find(r => r.id === state.route);
        if (!currentRouteValid) {
            // 如果当前路由不可用，跳转到该角色的默认路由
            state.route = state.profile.role === "parent" ? "report-overview" : "map";
            saveState();
        }
    }

    function logoutCurrentSession() {
        sessionStorage.removeItem(ACTIVE_SESSION_KEY);
        state = clone(defaultState);
        render();
    }

        return sessionStore.order

            .filter((item) => item && item.profile);

    function getTimeOfDay() {
        const hour = new Date().getHours();
        if (hour >= 22 || hour < 6) return 'night'; // 22:00-6:00 夜晚
        if (hour >= 6 && hour < 8) return 'morning'; // 6:00-8:00 早晨
        if (hour >= 8 && hour < 12) return 'forenoon'; // 8:00-12:00 上午
        if (hour >= 12 && hour < 14) return 'noon'; // 12:00-14:00 中午
        if (hour >= 14 && hour < 18) return 'afternoon'; // 14:00-18:00 下午
        if (hour >= 18 && hour < 22) return 'evening'; // 18:00-22:00 傍晚
        return 'day';
    }

                { className: 'state-exercising', hint: '练习长途行走', description: '行走训练', emojis: ['🐫', '💪', '✨'] },
                { className: 'state-snacking', hint: '🌵 吃点仙人掌', description: '吃仙人掌', emojis: ['🌵', '😋', '💚'] },
                { className: 'state-curious', hint: '🐫 抬头看远方', description: '眺望远方', emojis: ['👀', '🏜️', '💭'] },
                { className: 'state-playing', hint: '沙浴时间到~', description: '沙浴SPA', emojis: ['✨', '🏜️', '💆'] }
            ]
        };

        // 合并状态：时间状态 + 动物特定状态 + 通用状态
        let availableStates = [...commonStates];

        // 添加时间相关状态
        if (timeStates[timeOfDay]) {
            availableStates = [...availableStates, ...timeStates[timeOfDay]];
        }

        // 添加动物特定状态
        if (animalSpecificStates[animalId]) {
            availableStates = [...availableStates, ...animalSpecificStates[animalId]];
        }

        // 随机选择一个状态
        return availableStates[Math.floor(Math.random() * availableStates.length)];
    }

    // 切换动物状态
    function toggleAnimalState(animalId) {
        if (!state.animalStates) {
            state.animalStates = {};
        }

        // 获取新的随机状态
        const newState = getRandomAnimalState(animalId);
        state.animalStates[animalId] = newState;

        saveState();
        render();

        // 渲染完成后添加飘浮emoji特效
        setTimeout(() => {
            createFloatingEmojis(newState.emojis || ['✨', '💫', '⭐']);
        }, 50);
    }

    // 创建飘浮emoji特效
    function createFloatingEmojis(emojis) {
        const container = document.getElementById('stateEffects');
        if (!container) return;

        // 清除旧的特效
        container.innerHTML = '';

        // 创建多个飘浮emoji
        const emojiCount = 5 + Math.floor(Math.random() * 3); // 5-7个emoji
        for (let i = 0; i < emojiCount; i++) {
            setTimeout(() => {
                const emoji = document.createElement('div');
                emoji.className = 'floating-emoji';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];

                // 随机位置
                const randomX = 20 + Math.random() * 60; // 20%-80%的位置
                const randomDelay = Math.random() * 0.5; // 0-0.5s延迟

                emoji.style.left = `${randomX}%`;
                emoji.style.bottom = '30%';
                emoji.style.animationDelay = `${randomDelay}s`;

                container.appendChild(emoji);

                // 3秒后移除
                setTimeout(() => {
                    if (emoji.parentNode) {
                        emoji.parentNode.removeChild(emoji);
                    }
                }, 3000);
            }, i * 200); // 每个emoji间隔200ms出现
        }
    }

    function getAvailableRoutes() {
        if (!state.profile) return routes;
        const userRole = state.profile.role || "child";
        return routes.filter(route => route.roles.includes(userRole));
    }

    function getRoute(id = state.route) {
        if (id === "doctor") id = "qa";
        const availableRoutes = getAvailableRoutes();
        return availableRoutes.find((route) => route.id === id) || availableRoutes[0];
    }

    function setRoute(route) {
        if (route === "doctor") route = "qa";
        // 检查当前角色是否有权限访问此路由
        const availableRoutes = getAvailableRoutes();
        if (!availableRoutes.find(r => r.id === route)) {
            // 如果没有权限，跳转到该角色的第一个可用路由
            route = availableRoutes[0].id;
        }
        state.route = route;
        saveState();
        render();
    }

    function selectAnimal(id, source = "地图探索") {
        const animal = animals.find(a => a.id === id);
        state.selectedAnimalId = id;
        state.selectedAnimal = id; // Also set for new QA view
        state.lastQuiz = null;
        state.progress.visits[id] = (state.progress.visits[id] || 0) + 1;
        // 更新当前备用问题
        state.currentQuickQuestion = {
            animalId: id,
            question: animal.quick?.[0] || `${animal.name}有什么特别的地方？`,
            isGenerating: false
        };
        addActivity("探索", `${getAnimalDisplayName(id)}：${source}`, id);
        saveState();
        render();
    }

    function addActivity(type, label, animalId = state.selectedAnimalId) {
        state.progress.activities.unshift({
            type,
            label,
            animalId,
            time: Date.now()
        });
        // 限制活动记录数量，防止数据过大
        state.progress.activities = state.progress.activities.slice(0, 1000);
    }

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatStoryText(text) {
        // 将故事文本按段落分隔，为每个段落添加缩进
        if (!text) return '';

        // 按换行符分割段落
        const paragraphs = text.split('\n').filter(p => p.trim());

        // 为每个段落添加两个全角空格的缩进
        return paragraphs.map(p => '　　' + p.trim()).join('\n\n');
    }

    function formatTime(time) {
        const date = new Date(time);
        return `${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function render() {
        // 如果没有 profile，尝试从 index-login.html 创建的会话加载
        if (!state.profile) {
            // 重新加载状态，以防会话刚刚创建
            const activeId = sessionStorage.getItem(ACTIVE_SESSION_KEY);
            if (activeId && sessionStore.sessions[activeId]) {
                state = mergeState(clone(defaultState), sessionStore.sessions[activeId]);
            } else {
                // 没有会话，跳转到登录页
                window.location.href = '/static/index-login.html';
                return;
            }
        }
        validateAndFixRoute();
        renderShell();

        // Check if we're in demonstration stage (showing correct answer animation)
        if (state.qaStage === 'demonstration') {
            return renderDemonstration(animal);

        // Check if we're in doctor consultation mode
        if (state.qaStage === 'doctor') {
            return renderDoctorConsultation(animal);
        }

        // Check if we're in animal selection mode (no animal selected yet, or explicitly requested)
        if (!state.selectedAnimal || state.qaStage === 'selection') {
            return renderAnimalSelection();
        }

        // Check if we're in loading animation stage
        if (state.qaStage === 'loading') {
            return renderAnimalLoading(animal);

        return renderAnimalCare(animal);

    function creatureAssetUrl(type, id) {
        const list = type === "body" ? creatureBodies : type === "wing" ? creatureWings : creatureTails;
        const fallback = list[0];
        const item = list.find((asset) => asset.id === id) || fallback;
        return `${imagineAssetBase}${item.file}`;
    }

    function normalizeCreatureBody(id) {
        return { puppy: "dog", bunny: "rabbit" }[id] || (creatureBodies.some((item) => item.id === id) ? id : "panda");
    }

    function normalizeCreatureWing(id) {
        if (!id) return "";
        return { butterfly: "fairy" }[id] || (creatureWings.some((item) => item.id === id) ? id : "angel");
    }

    function normalizeCreatureTail(id) {
        if (!id) return "";
        return { leaf: "dino" }[id] || (creatureTails.some((item) => item.id === id) ? id : "curl");
    }

    function creatureMaterialButton(type, item, active) {
        return `<button class="material-button ${active ? "active" : ""}" type="button" draggable="true" data-creature-part-type="${type}" data-creature-part-id="${item.id}" data-creature-${type}="${item.id}" aria-label="${item.label}" title="${item.label}"><img class="material-img" src="${imagineAssetBase}${item.file}" alt=""></button>`;
    }

    function creatureThumbEmoji(body) {
        return { panda: "🐼", puppy: "🐶", bunny: "🐰" }[body] || "🐼";
    }

    function creaturePartButton(part, label) {
        const parts = Array.isArray(state.draftCreature.parts) ? state.draftCreature.parts : [];
        const active = parts.includes(part);
        return `<button class="chip ${active ? "active" : ""}" type="button" data-creature-part="${part}">${label}</button>`;
    }

    function creaturePreview(draft) {
        const parts = new Set(Array.isArray(draft.parts) ? draft.parts : []);
        const body = normalizeCreatureBody(draft.body || "panda");
        const wing = parts.has("wing") ? normalizeCreatureWing(draft.wing || "angel") : "";
        const tail = parts.has("tail") ? normalizeCreatureTail(draft.tail || "curl") : "";
        const hasHorn = parts.has("horn");
        return `
            <div class="imagine-stage" data-creature-drop-zone="true">
                <div class="creature-preview raster-creature" style="--creature-color: ${draft.color || "#8fc6f5"};">

                    ${hasHorn ? `<span class="asset-horn" aria-hidden="true"></span>` : ""}
                    <img class="creature-asset asset-body" data-body="${body}" src="${creatureAssetUrl("body", body)}" alt="">

        `;
    }
