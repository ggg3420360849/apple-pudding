    function getFilteredStories() {
        let filtered = [...state.stories];

        // 按动物筛选
        if (state.storyFilter.animal) {
            filtered = filtered.filter(s => s.animalId === state.storyFilter.animal);
        }

        // 按关键词搜索
        if (state.storyFilter.search) {
            const search = state.storyFilter.search.toLowerCase();
            filtered = filtered.filter(s =>
                (s.title && s.title.toLowerCase().includes(search)) ||
                (s.text && s.text.toLowerCase().includes(search))
            );
        }

        // 排序
        if (state.storyFilter.sort === "reads") {
            filtered.sort((a, b) => (b.readCount || 0) - (a.readCount || 0));
        } else if (state.storyFilter.sort === "favorite") {
            filtered.sort((a, b) => (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0));
        } else {
            filtered.sort((a, b) => b.time - a.time);
        }

        return filtered;
    }

    async function askAI(mode, message, outputId, metaId, extra = {}) {
        const output = document.getElementById(outputId);
        const meta = document.getElementById(metaId);
        const animal = getAnimal();
        const model = extra.model || state.model;

        // 如果元素存在，显示加载状态
        if (output) {
            output.className = "answer-panel loading";
            output.textContent = "AI正在思考...";
        }
        if (meta) {
            meta.textContent = "";
        }

        try {
            const response = await fetch("/api/animal/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    mode,
                    message,
                    animal: animal.name,
                    model
                })
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.error || "AI接口返回失败");

            // 更新界面（如果元素存在）
            if (output) {
                output.className = "answer-panel";
                output.textContent = data.reply;
            }
            if (meta) {
                meta.textContent = `动物：${animal.name}｜模型：${data.model}`;
            }

            return { reply: data.reply, source: `模型：${data.model}` };
        } catch (error) {
            const reply = fallbackReply(mode, animal, message, extra);

            // 更新界面（如果元素存在）
            if (output) {
                output.className = "answer-panel";
                output.textContent = reply;
            }
            if (meta) {
                meta.textContent = `动物：${animal.name}｜离线回答：${error.message}`;
            }

            return { reply, source: "离线回答" };
        }
    }

    function fallbackReply(mode, animal, message, extra) {
        if (mode === "doctor") {
            return `${animal.name}的情况可以先观察精神、食欲、饮水和排便。\n1. 保持安静和干净环境。\n2. 记录症状出现的时间。\n3. 如果持续不吃、呼吸困难、流血或明显疼痛，请马上联系兽医。`;
        }
        if (mode === "story") {
            const theme = extra.theme || "小小探险";
            const themeText = theme.replace(/[🌙🔍🎓🏆]\s*/g, '');

            // 根据主题生成不同风格的离线故事
            if (theme.includes("睡前")) {
                return `《${animal.name}的温馨夜晚》\n\n夜晚来临，月光洒在${animal.habitat}上。${animal.name}结束了一天的探险，慢慢走回自己的小窝。\n\n它想起今天学到的本领：${animal.fact}\n\n${animal.name}闭上眼睛，听着周围轻柔的声音。它知道，明天又是充满惊喜的一天。晚安，${animal.name}。`;
            } else if (theme.includes("探险")) {
                return `《${animal.name}的大冒险》\n\n今天，${animal.name}在${animal.habitat}里发现了一条从未见过的小路。它好奇地走了过去。\n\n路上，${animal.name}遇到了小伙伴，它们一起寻找食物。${animal.name}记得：${animal.fact}\n\n最后，它们找到了美味的${animal.diet.split('、')[0]}，开心地分享着。这真是难忘的一天！`;
            } else if (theme.includes("科普")) {
                return `《认识${animal.name}》\n\n${animal.name}生活在${animal.habitat}，是一种很特别的动物。\n\n有趣的是，${animal.fact}这个特点帮助它在大自然中生存。\n\n${animal.name}喜欢吃${animal.diet}通过了解它的习性，我们能更好地保护它和它的家园。`;
            } else if (theme.includes("成长")) {
                return `《${animal.name}的成长》\n\n小${animal.name}慢慢长大了，它学会了很多本领。\n\n最重要的是：${animal.fact}这让它能够独立生活。\n\n现在，${animal.name}可以自己找到${animal.diet}它变得越来越勇敢和自信了！`;
            } else {
                return `《${animal.name}的${themeText}》\n\n在${animal.habitat}里，${animal.name}开始了新的一天。\n\n它记得自己的特点：${animal.fact}\n\n今天，${animal.name}遇到了一个小挑战，但它用智慧解决了问题。它告诉自己：每一天都是学习和成长的机会。`;
            }
        }
        return `${animal.name}生活在${animal.habitat}。${animal.fact}它常吃${animal.diet}如果你继续观察它的身体特点，就能发现动物和环境之间有很多有趣关系。`;
    }

    function showToast(text) {
        const toast = document.getElementById("toast");
        if (!toast) return;
        toast.textContent = text;
        toast.classList.remove("hide");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.add("hide"), 2200);
    }

    document.addEventListener("click", async (event) => {
        if (state.profile && state.settingsOpen && !event.target.closest(".settings-menu") && !event.target.closest("[data-action='toggle-settings']")) {
            state.settingsOpen = false;
            render();
            return;
        }

        const sessionButton = event.target.closest("[data-session-id]");
        if (sessionButton) {
            switchSession(sessionButton.dataset.sessionId);
            return;
        }

        const routeButton = event.target.closest("[data-route]");
        if (routeButton && state.profile) {
            setRoute(routeButton.dataset.route);
            return;
        }

        const animalButton = event.target.closest("[data-animal]");
        if (animalButton && state.profile) {
            selectAnimal(animalButton.dataset.animal);
            return;
        }

        const fillQuestion = event.target.closest("[data-fill-question]");
        if (fillQuestion) {
            const input = document.getElementById("qaQuestion");
            if (input) input.value = fillQuestion.dataset.fillQuestion;
            return;
        }

        const quizChoice = event.target.closest("[data-quiz-choice]");
        if (quizChoice) {
            await handleQuiz(Number(quizChoice.dataset.quizChoice));
            return;
        }

        const colorButton = event.target.closest("[data-creature-color]");
        if (colorButton) {
            updateCreatureDraft();
            state.draftCreature.color = colorButton.dataset.creatureColor;
            saveState();
            render();
            return;
        }

        const bodyButton = event.target.closest("[data-creature-body]");
        if (bodyButton) {
            updateCreatureDraft();
            applyCreaturePart("body", bodyButton.dataset.creatureBody);
            return;
        }

        const wingButton = event.target.closest("[data-creature-wing]");
        if (wingButton) {
            updateCreatureDraft();
            applyCreaturePart("wing", wingButton.dataset.creatureWing);
            return;
        }

        const tailButton = event.target.closest("[data-creature-tail]");
        if (tailButton) {
            updateCreatureDraft();
            applyCreaturePart("tail", tailButton.dataset.creatureTail);
            return;
        }

        const partButton = event.target.closest("[data-creature-part]");
        if (partButton) {
            updateCreatureDraft();
            if (!Array.isArray(state.draftCreature.parts)) state.draftCreature.parts = [];
            const part = partButton.dataset.creaturePart;
            if (state.draftCreature.parts.includes(part)) {
                state.draftCreature.parts = state.draftCreature.parts.filter((item) => item !== part);
            } else {
                state.draftCreature.parts.push(part);
            }
            saveState();
            render();
            return;
        }

        const action = event.target.closest("[data-action]")?.dataset.action;
        if (!action) return;

        if (action === "toggle-settings") {
            state.settingsOpen = !state.settingsOpen;
            render();
            return;
        }
        if (action === "logout") {
            logoutCurrentSession();
            return;
        }
        if (action === "reset-quiz") {
            state.lastQuiz = null;
            saveState();
            render();
            return;
        }
        if (action === "ask-qa") await handleAskQa();
        if (action === "refresh-quick-question") await handleRefreshQuickQuestion();
        if (action === "fill-quick-question") handleFillQuickQuestion();
        if (action === "ask-doctor") await handleAskDoctor();
        if (action === "select-animal") {
            const animalId = event.target.closest("[data-animal-id]")?.dataset.animalId;
            if (animalId) {
                const animal = animals.find(a => a.id === animalId);
                state.selectedAnimal = animalId;
                state.qaStage = 'loading';
                // 更新当前备用问题
                state.currentQuickQuestion = {
                    animalId: animalId,
                    question: animal.quick?.[0] || `${animal.name}有什么特别的地方？`,
                    isGenerating: false
                };
                saveState();
                render();
                // Simulate loading animation for 2.5 seconds
                setTimeout(() => {
                    state.qaStage = 'care';
                    saveState();
                    render();
                }, 2500);
            }
            return;
        }
        if (action === "change-animal") {
            state.qaStage = 'selection';
            saveState();
            render();
            return;
        }
        if (action === "toggle-animal-state") {
            const animalId = state.selectedAnimal || state.selectedAnimalId;
            if (animalId) {
                toggleAnimalState(animalId);
            }
            return;
        }
        if (action === "open-doctor") {
            state.qaStage = 'doctor';
            saveState();
            render();
            return;
        }
        if (action === "close-doctor") {
            state.qaStage = 'care';
            saveState();
            render();
            return;
        }
        if (action === "ask-doctor-consultation") await handleAskDoctorConsultation();
        if (action === "toggle-voice-input-doctor") toggleVoiceInputDoctor(event.target.closest("button"));
        if (action === "read-doctor-answer") readDoctorAnswer();
        if (action === "read-qa-answer") readQaAnswer();
        if (action === "save-nickname") {
            const input = document.getElementById('animalNickname');
            if (input) {
                const nickname = input.value.trim();
                const animal = getAnimal();
                if (nickname && nickname !== animal.name) {
                    state.animalNicknames[animal.id] = nickname;
                    saveState();
                    showToast(`已将${animal.name}改名为 ${nickname}`);
                } else if (!nickname) {
                    delete state.animalNicknames[animal.id];
                    saveState();
                    showToast(`已恢复为 ${animal.name}`);
                }
                render();
            }
            return;
        }
        if (action === "save-creature") saveCreature();
        if (action === "random-creature") randomCreature();
        if (action === "clear-creature-parts") clearCreatureParts();
        if (action === "make-story") await makeStory();
        if (action === "continue-story") await continueStory();
        if (action === "read-story") readStory();
        if (action === "toggle-favorite") toggleFavorite();
        if (action === "toggle-voice-input") toggleVoiceInput(event.target.closest("button"));
        if (action === "toggle-voice-input-qa") toggleVoiceInputQa(event.target.closest("button"));
        if (action === "export-data") exportData();
        if (action === "print-report") window.print();
        if (action === "reset-progress") resetProgress();
    });

        event.dataTransfer.effectAllowed = "copy";
    });

        if (!dropZone) return;
        event.preventDefault();
        dropZone.classList.add("drag-over");
        event.dataTransfer.dropEffect = "copy";

        const dropZone = event.target.closest("[data-creature-drop-zone]");

    // 防抖函数
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // 生成新的快速问题
    async function generateQuickQuestion(animal) {
        const existingQuestions = animal.quick ? animal.quick.join('、') : '';
        const prompt = `你是一个专业的儿童动物科普教育专家。请为${animal.name}生成一个适合5-8岁儿童的有趣问题。

要求：
1. 问题要简短，15字以内
2. 问题要有趣，能激发好奇心
3. 问题要有教育意义
4. 避免重复：${existingQuestions}
5. 只输出问题本身，不要额外解释

示例：${animal.name}为什么...？${animal.name}怎么...？${animal.name}的...有什么用？

请直接输出一个问题：`;

        try {
            const response = await fetch('/api/animal/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mode: 'qa',
                    message: prompt,
                    animal: animal.name,
                    model: state.model
                })
            });

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || 'AI接口返回失败');
            }

            let question = data.reply.trim();

            // 清理可能的额外内容
            question = question.replace(/^["「『]|["」』]$/g, '');
            question = question.split('\n')[0]; // 只取第一行
            question = question.replace(/^问题[:：]\s*/, ''); // 移除"问题："前缀

            // 确保问题以问号结尾
            if (!question.endsWith('？') && !question.endsWith('?')) {
                question += '？';
            }

            // 限制长度
            if (question.length > 20) {
                question = question.substring(0, 18) + '...？';
            }

            return question;
        } catch (error) {
            console.error('生成问题失败:', error);
            // 返回默认问题
            const defaultQuestions = animal.quick || [];
            const randomIndex = Math.floor(Math.random() * defaultQuestions.length);
            return defaultQuestions[randomIndex] || `${animal.name}有什么特别的地方？`;
        }
    }

    function ensureCreatureParts() {
        if (!Array.isArray(state.draftCreature.parts)) state.draftCreature.parts = [];
        return state.draftCreature.parts;
    }

    function applyCreaturePart(type, id) {
        const parts = ensureCreatureParts();
        if (type === "body") {
            state.draftCreature.body = normalizeCreatureBody(id);
        }
        if (type === "wing") {
            state.draftCreature.wing = normalizeCreatureWing(id) || "angel";
            if (!parts.includes("wing")) parts.push("wing");
        }
        if (type === "tail") {
            state.draftCreature.tail = normalizeCreatureTail(id) || "curl";
            if (!parts.includes("tail")) parts.push("tail");
        }
        if (type === "horn" && !parts.includes("horn")) {
            parts.push("horn");
        }
        saveState();
        render();
    }

    function clearCreatureParts() {
        updateCreatureDraft();
        state.draftCreature.wing = "";
        state.draftCreature.tail = "";
        state.draftCreature.parts = [];

        render();
        showToast("已清除配件");
    }

    function saveCreature() {
        updateCreatureDraft();
        const currentParts = Array.isArray(state.draftCreature.parts) ? state.draftCreature.parts : [];
        const partsMap = { wing: "会飞翔", tail: "会平衡", horn: "会发光" };
        const wingMap = Object.fromEntries(creatureWings.map((item) => [item.id, item.label]));
        const tailMap = Object.fromEntries(creatureTails.map((item) => [item.id, item.label]));
        const item = {
            ...clone(state.draftCreature),
            parts: [
                state.draftCreature.wing ? wingMap[normalizeCreatureWing(state.draftCreature.wing)] : null,
                state.draftCreature.tail ? tailMap[normalizeCreatureTail(state.draftCreature.tail)] : null,
                ...currentParts.filter((part) => !["wing", "tail"].includes(part)).map((part) => partsMap[part] || part)
            ].filter(Boolean),
            time: Date.now()
        };
        state.creations.unshift(item);
        state.creations = state.creations.slice(0, 12);
        state.progress.creations += 1;
        addActivity("创作", item.name);
        saveState();

        button.disabled = true;

            const length = document.getElementById("storyLength").value;

            // 使用当前状态中的模型，如果没有则使用默认模型
            const model = state.model || models[0];

            state.storyLength = length;

            const lengthMap = {
                short: "请写一个150-200字的短故事（约2分钟）",
                medium: "请写一个300-400字的中等长度故事（约5分钟）",
                long: "请写一个500-700字的长故事（约10分钟）"
            };

            // 构建完整的故事生成提示词
            // 故事愿望可以为空，AI会根据主题和动物自动生成
            let message = `${lengthMap[length]}。主题：${theme}。`;
            if (prompt) {
                message += `孩子的故事愿望：${prompt}。请根据孩子的愿望来创作故事。`;
            } else {
                message += `请创作一个关于${getAnimal().name}的${theme.replace(/[🌙🔍🎓🏆]\s*/g, '')}故事。`;
            }
            message += `\n\n重要：请在故事开头第一行写上吸引小朋友的标题（用《》包裹，不要超过15个字），然后空一行，再写故事正文。标题要生动有趣，能吸引3-10岁儿童。`;

            const result = await askAI("story", message, "storyAnswer", "storyMeta", { model, theme });

            // 从返回的故事中提取标题和正文
            let title = `《${getAnimal().name}的故事》`;  // 默认标题
            let storyText = result.reply;

            // 尝试提取AI生成的标题
            const titleMatch = result.reply.match(/^《(.+?)》\s*\n/);
            if (titleMatch) {
                title = `《${titleMatch[1]}》`;
                storyText = result.reply.replace(/^《.+?》\s*\n+/, '');  // 移除标题部分
            }

            const tags = [];
            if (theme.includes("睡前")) tags.push("睡前");
            if (theme.includes("探险")) tags.push("探险");
            if (theme.includes("科普")) tags.push("科普");
            if (theme.includes("成长")) tags.push("成长");
            if (theme.includes("新朋友")) tags.push("友谊");
            if (theme.includes("勇敢")) tags.push("勇敢");

            state.stories.unshift({
                animalId: state.selectedAnimalId,
                title,
                text: storyText,  // 使用提取的正文，不包含标题
                source: result.source,
                time: Date.now(),
                length: length,
                tags: tags,
                isFavorite: false,
                readCount: 0
            });
            state.stories = state.stories.slice(0, 24);
            state.progress.stories += 1;
            addActivity("故事", title, state.selectedAnimalId);

            // 更新解锁统计
            updateInteractionStats(state.selectedAnimalId, "storyGenerated");

            saveState();
            render();
            showToast("故事生成成功！");
        } catch (error) {
            console.error("故事生成失败:", error);
            showToast("故事生成失败，请重试");
        } finally {
            // 恢复按钮状态
            button.disabled = false;
            button.textContent = originalText;
        }
    }

    let currentUtterance = null;
    let isPaused = false;
    let lastClickTime = 0;

    function cleanTextForReading(text) {
        // 清理Markdown、特殊符号和emoji，使朗读更自然
        return text
            .replace(/#{1,6}\s/g, '')           // 移除 # 标题符号
            .replace(/\*\*(.+?)\*\*/g, '$1')    // 移除 **粗体**
            .replace(/\*(.+?)\*/g, '$1')        // 移除 *斜体*
            .replace(/_(.+?)_/g, '$1')          // 移除 _下划线_
            .replace(/`(.+?)`/g, '$1')          // 移除 `代码`
            .replace(/\[(.+?)\]\(.+?\)/g, '$1') // 移除链接，保留文字
            .replace(/[【】《》「」『』]/g, '') // 移除中文特殊括号
            .replace(/[[\](){}]/g, '')          // 移除英文括号
            .replace(/[~!@$%^&*+=|\\<>?]/g, '') // 移除特殊符号
            // emoji处理：替换为空格（产生自然的短暂停顿，而非逗号的生硬感）
            .replace(/[\u{1F300}-\u{1F9FF}]/gu, ' ')
            .replace(/[\u{2600}-\u{26FF}]/gu, ' ')
            .replace(/[\u{2700}-\u{27BF}]/gu, ' ')
            .replace(/[\u{FE00}-\u{FE0F}]/gu, '')
            .replace(/[\u{1F600}-\u{1F64F}]/gu, ' ')
            .replace(/[\u{1F680}-\u{1F6FF}]/gu, ' ')
            .replace(/[\u{1F1E0}-\u{1F1FF}]/gu, ' ')
            .replace(/\s{2,}/g, ' ')            // 多个空格合并为一个（更自然的停顿）
            .trim();
    }

    function readStory() {
        const rawText = document.getElementById("storyAnswer")?.textContent.trim();
        if (!rawText || rawText === "故事会显示在这里。") {
            showToast("请先生成故事");
            return;
        }
        if (!window.speechSynthesis) {
            showToast("当前浏览器不支持朗读");
            return;
        }

        const now = Date.now();
        const timeSinceLastClick = now - lastClickTime;
        lastClickTime = now;

        // 如果正在暂停状态
        if (isPaused) {
            // 快速双击（500ms内）则停止
            if (timeSinceLastClick < 500) {
                stopReading();
                showToast("已停止朗读");
                return;
            }
            // 单击则继续 - 立即更新按钮
            updateReadButton("暂停");
            isPaused = false;
            window.speechSynthesis.resume();
            return;
        }

        // 如果正在朗读，则暂停
        if (window.speechSynthesis.speaking && !isPaused) {
            // 立即更新按钮提供即时反馈
            updateReadButton("继续");
            isPaused = true;
            window.speechSynthesis.pause();
            return;
        }

        // 新建朗读 - 立即更新按钮提供即时反馈
        updateReadButton("暂停");

        // 使用清理后的文本
        const cleanText = cleanTextForReading(rawText);
        window.speechSynthesis.cancel();

        currentUtterance = new SpeechSynthesisUtterance(cleanText);
        currentUtterance.lang = "zh-CN";
        currentUtterance.rate = 0.85;
        currentUtterance.pitch = 1.05;
        currentUtterance.volume = 0.95;

        // 优先选择更自然的中文女声
        const voices = window.speechSynthesis.getVoices();
        const preferredVoices = [
            'Microsoft Yunxi Online (Natural) - Chinese (Mainland)',
            'Microsoft Xiaoxiao Online (Natural) - Chinese (Mainland)',
            'Microsoft Yaoyao - Chinese (Mainland)',
            'Xiaoxiao',
            'Yaoyao',
            'Tingting'
        ];

        let selectedVoice = null;
        for (const preferred of preferredVoices) {
            selectedVoice = voices.find(v => v.name.includes(preferred));
            if (selectedVoice) break;
        }

        if (!selectedVoice) {
            selectedVoice = voices.find(v =>
                v.lang.includes('zh') &&
                (v.name.includes('Female') || v.name.includes('female'))
            );
        }

        if (!selectedVoice) {
            selectedVoice = voices.find(v => v.lang.includes('zh'));
        }

        if (selectedVoice) {
            currentUtterance.voice = selectedVoice;
        }

        currentUtterance.onstart = () => {
            // 确保按钮状态正确
            updateReadButton("暂停");
        };

        currentUtterance.onend = () => {
            updateReadButton("朗读");
            isPaused = false;
            incrementReadCount();
        };

        currentUtterance.onerror = () => {
            updateReadButton("朗读");
            isPaused = false;
        };

        // 立即开始朗读
        window.speechSynthesis.speak(currentUtterance);
    }

    function stopReading() {

        currentUtterance = null;

    let recognition = null;

    let useSimpleMode = false;  // 简化模式标志

    function toggleVoiceInput(button) {
        // 优先检查 Chrome 浏览器
        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        const isEdge = /Edg/.test(navigator.userAgent);
        const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);

        // 检查浏览器兼容性

        if (!SpeechRecognition) {
            showToast("您的浏览器不支持语音识别。\n请使用 Google Chrome 浏览器以获得最佳体验。\n其他支持的浏览器：Edge、Safari");
            return;
        }

        // 检查是否在安全上下文（HTTPS或localhost）
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            showToast('语音识别需要HTTPS协议，请使用https://访问或在本地测试');

    function startVoiceInput(button) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        // 检测浏览器类型以优化配置
        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        const isEdge = /Edg/.test(navigator.userAgent);

        // 检查是否已经有实例在运行
        if (recognition) {
            try {
                recognition.stop();
            } catch (e) {
                // 忽略停止错误
            }
            recognition = null;
        }

        recognition = new SpeechRecognition();

        // 优化的语音识别配置 - 优先为 Chrome 优化，其他浏览器兼容
        recognition.lang = 'zh-CN';

        if (useSimpleMode) {
            // 简化模式：适用于网络受限或非 Chrome 浏览器
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        } else if (isChrome || isEdge) {
            // Chrome/Edge 标准模式：连续识别，最佳体验
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
        } else {
            // 其他浏览器：保守配置
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
        }

        const voiceStatus = document.getElementById('voiceStatus');
        const voiceIcon = document.getElementById('voiceIcon');
        const storyPrompt = document.getElementById('storyPrompt');
        const voiceButton = button || document.getElementById('voiceInputBtn');

        if (!voiceStatus || !voiceIcon || !storyPrompt || !voiceButton) {
            showToast('页面元素加载异常，请刷新页面');
            return;
        }

        // 清空文本框，准备接收语音输入
        if (storyPrompt.value === '今天想知道什么故事呀？试试点击话筒说出来...' ||
            storyPrompt.value.trim() === '') {
            storyPrompt.value = '';
        }

        voiceButton.classList.add('recording');
        voiceIcon.textContent = '🎙️';
        voiceStatus.style.display = 'block';
        document.getElementById('voiceStatusText').textContent = '正在聆听...开始说话吧';
        isRecording = true;
        restartAttempts = 0;

        finalTranscript = '';
        interimTranscript = '';

        // 清除之前的超时定时器
        if (recognitionTimeout) {
            clearTimeout(recognitionTimeout);
            recognitionTimeout = null;
        }

        recognition.onstart = () => {
            isRecording = true;
            restartAttempts = 0;

            voiceButton.classList.add('recording');
            voiceIcon.textContent = '🎙️';
            voiceStatus.style.display = 'block';
            document.getElementById('voiceStatusText').textContent = '正在聆听...';
        };

        recognition.onresult = (event) => {
            // 重置超时定时器
            if (recognitionTimeout) {
                clearTimeout(recognitionTimeout);
            }

            // 重新构建完整的识别文本
            let newFinalTranscript = '';
            let newInterimTranscript = '';

            // 遍历所有结果
            for (let i = 0; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;

                if (event.results[i].isFinal) {
                    newFinalTranscript += transcript;
                } else {
                    newInterimTranscript += transcript;
                }
            }

            // 更新全局变量
            finalTranscript = newFinalTranscript;
            interimTranscript = newInterimTranscript;

            // 实时更新文本框 - 组合最终结果和临时结果
            const displayText = finalTranscript + (interimTranscript ? interimTranscript : '');

            if (displayText.trim()) {
                storyPrompt.value = displayText;
                const statusText = interimTranscript ?
                    `正在识别: ${interimTranscript}` :
                    `已识别 ${finalTranscript.length} 字`;
                document.getElementById('voiceStatusText').textContent = statusText;
            }

            // 设置新的超时定时器（6秒无新输入自动停止）
            recognitionTimeout = setTimeout(() => {

                    stopVoiceInput(true);

            }, 6000);
        };

        recognition.onspeechstart = () => {
            document.getElementById('voiceStatusText').textContent = '正在识别中...';

        recognition.onerror = (event) => {
            // 清除超时定时器
            if (recognitionTimeout) {
                clearTimeout(recognitionTimeout);
                recognitionTimeout = null;
            }

            if (event.error === 'no-speech') {
                if (restartAttempts < MAX_RESTART_ATTEMPTS) {
                    restartAttempts++;
                    // 不显示错误提示，自动重启
                    if (isRecording) {
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch (e) {
                                showToast('没有听到声音，请靠近麦克风说话');
                                stopVoiceInput();
                            }
                        }, 100);
                    }
                    return;
                } else {
                    showToast('没有检测到声音，请检查麦克风并靠近说话');
                }
            } else if (event.error === 'network') {
                // 第一次网络错误：切换到简化模式重试
                if (!useSimpleMode && restartAttempts < 2) {
                    useSimpleMode = true;
                    restartAttempts++;

                    if (isRecording) {
                        setTimeout(() => {
                            try {
                                stopVoiceInput();
                                showToast('切换到简化模式，请再次点击话筒并说话');
                            } catch (e) {
                                stopVoiceInput();
                            }
                        }, 500);
                    }
                    return;
                }

                // 简化模式也失败：给出详细建议
                const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
                if (!isChrome) {
                    showToast('网络错误。建议使用 Google Chrome 浏览器获得最佳体验。\n当前浏览器的语音识别功能可能受限。');
                } else {
                    showToast('网络问题导致无法识别。解决方法：\n1. 检查网络连接是否稳定\n2. 如开启VPN建议暂时关闭\n3. 刷新页面后重试');
                }
            } else if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                showToast('请在浏览器设置中允许使用麦克风：点击地址栏左侧图标→网站设置→麦克风→允许');
            } else if (event.error === 'aborted') {
                // 主动停止，不提示错误
                return;
            } else if (event.error === 'audio-capture') {
                showToast('无法访问麦克风，请检查：\n1. 麦克风是否被其他应用占用\n2. 浏览器是否有麦克风权限\n建议使用 Chrome 浏览器');
            } else if (event.error === 'service-not-allowed') {
                showToast('语音服务不可用。\n强烈建议使用 Google Chrome 浏览器以获得最佳体验。\nChrome 对语音识别的支持最完善。');
            } else {
                showToast(`识别出错(${event.error})。\n建议使用 Google Chrome 浏览器获得最佳体验。`);
            }
            stopVoiceInput();
        };

        recognition.onend = () => {
            // 简化模式下：单次识别完成后立即显示结果
            if (useSimpleMode && finalTranscript.trim()) {
                stopVoiceInput(true);
                return;
            }

            // 标准模式：自动重启保持连续识别
            if (isRecording && !useSimpleMode && restartAttempts < MAX_RESTART_ATTEMPTS) {
                // 如果还在录音状态且未达到重试上限，自动重启
                try {
                    setTimeout(() => {
                        if (isRecording) {
                            recognition.start();
                        }
                    }, 100);
                } catch (e) {
                    stopVoiceInput();
                }
            } else if (!isRecording) {
                // 已经手动停止，清理状态
                stopVoiceInput();
            }
        };

        try {
            recognition.start();
        } catch (error) {
            showToast('无法启动语音识别，请检查麦克风权限');
            stopVoiceInput();
        }
    }

                return;
            }

            if (isRecordingQa && !useSimpleModeQa && restartAttemptsQa < MAX_RESTART_ATTEMPTS) {
                try {
                    setTimeout(() => {
                        if (isRecordingQa) {
                            recognitionQa.start();
                        }
                    }, 100);
                } catch (e) {
                    stopVoiceInputQa();
                }
            } else if (!isRecordingQa) {
                stopVoiceInputQa();
            }
        };

        try {
            recognitionQa.start();
        } catch (error) {
            showToast('无法启动语音识别，请检查麦克风权限');
            stopVoiceInputQa();
        }
    }

    function stopVoiceInputQa(autoStop = false) {
        if (recognitionTimeoutQa) {
            clearTimeout(recognitionTimeoutQa);
            recognitionTimeoutQa = null;
        }

        isRecordingQa = false;

        if (recognitionQa) {
            try {
                recognitionQa.stop();
            } catch (e) {
                // 忽略停止错误
            }
            recognitionQa = null;
        }

        const voiceStatus = document.getElementById('voiceStatusQa');
        const voiceIcon = document.getElementById('voiceIconQa');
        const button = document.getElementById('voiceInputBtnQa');
        const qaQuestion = document.getElementById('qaQuestion');

        if (button) button.classList.remove('recording');
        if (voiceIcon) voiceIcon.textContent = '🎤';
        if (voiceStatus) voiceStatus.style.display = 'none';

        if (finalTranscriptQa && qaQuestion) {
            const text = finalTranscriptQa.trim();
            if (text) {
                qaQuestion.value = text;
            }
        } else if (!autoStop && !finalTranscriptQa) {
            if (qaQuestion && !qaQuestion.value.trim()) {
                qaQuestion.placeholder = '想问什么问题呢？试试点击话筒说出来...';
            }
        }

        finalTranscriptQa = '';
        interimTranscriptQa = '';
        restartAttemptsQa = 0;
    }

    // Voice input for doctor consultation
    function toggleVoiceInputDoctor(button) {
        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            showToast("您的浏览器不支持语音识别。\n请使用 Google Chrome 浏览器以获得最佳体验。");
            return;
        }

        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            showToast('语音识别需要HTTPS协议，请使用https://访问或在本地测试');
            return;
        }

        if (isRecordingDoctor) {
            stopVoiceInputDoctor();
        } else {
            startVoiceInputDoctor(button);
        }
    }

    let recognitionDoctor = null;
    let isRecordingDoctor = false;
    let finalTranscriptDoctor = '';
    let interimTranscriptDoctor = '';
    let recognitionTimeoutDoctor = null;
    let restartAttemptsDoctor = 0;
    let useSimpleModeDoctor = false;

    function startVoiceInputDoctor(button) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);

        if (recognitionDoctor) {
            try {
                recognitionDoctor.stop();
            } catch (e) {}
            recognitionDoctor = null;
        }

        recognitionDoctor = new SpeechRecognition();
        recognitionDoctor.lang = 'zh-CN';
        recognitionDoctor.continuous = true;
        recognitionDoctor.interimResults = true;
        recognitionDoctor.maxAlternatives = 1;

        const voiceStatus = document.getElementById('voiceStatusDoctor');
        const voiceIcon = document.getElementById('voiceIconDoctor');
        const doctorQuestion = document.getElementById('doctorQuestion');
        const voiceButton = button || document.getElementById('voiceInputBtnDoctor');

        if (!voiceStatus || !voiceIcon || !doctorQuestion || !voiceButton) {
            showToast('页面元素加载异常，请刷新页面');
            return;
        }

        if (doctorQuestion.value.trim() === '' || doctorQuestion.value === doctorQuestion.placeholder) {
            doctorQuestion.value = '';
        }

        voiceButton.classList.add('recording');
        voiceIcon.textContent = '🎙️';
        voiceStatus.style.display = 'block';
        document.getElementById('voiceStatusTextDoctor').textContent = '正在聆听...';
        isRecordingDoctor = true;
        restartAttemptsDoctor = 0;
        finalTranscriptDoctor = '';
        interimTranscriptDoctor = '';

        if (recognitionTimeoutDoctor) {
            clearTimeout(recognitionTimeoutDoctor);
            recognitionTimeoutDoctor = null;
        }

        recognitionDoctor.onstart = () => {
            isRecordingDoctor = true;
            voiceButton.classList.add('recording');
            voiceIcon.textContent = '🎙️';
            voiceStatus.style.display = 'block';
        };

        recognitionDoctor.onresult = (event) => {
            if (recognitionTimeoutDoctor) {
                clearTimeout(recognitionTimeoutDoctor);
            }

            let newFinalTranscript = '';
            let newInterimTranscript = '';

            for (let i = 0; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    newFinalTranscript += transcript;
                } else {
                    newInterimTranscript += transcript;
                }
            }

            finalTranscriptDoctor = newFinalTranscript;
            interimTranscriptDoctor = newInterimTranscript;

            const displayText = finalTranscriptDoctor + (interimTranscriptDoctor ? interimTranscriptDoctor : '');
            if (displayText.trim()) {
                doctorQuestion.value = displayText;
                document.getElementById('voiceStatusTextDoctor').textContent =
                    interimTranscriptDoctor ? `正在识别: ${interimTranscriptDoctor}` : `已识别 ${finalTranscriptDoctor.length} 字`;
            }

            recognitionTimeoutDoctor = setTimeout(() => {
                if (isRecordingDoctor && finalTranscriptDoctor.trim()) {
                    stopVoiceInputDoctor(true);
                }
            }, 6000);
        };

        recognitionDoctor.onerror = (event) => {
            if (recognitionTimeoutDoctor) {
                clearTimeout(recognitionTimeoutDoctor);
                recognitionTimeoutDoctor = null;
            }
            if (event.error !== 'aborted' && event.error !== 'no-speech') {
                showToast(`语音识别出错: ${event.error}`);
            }
            stopVoiceInputDoctor();
        };

        recognitionDoctor.onend = () => {
            if (isRecordingDoctor && restartAttemptsDoctor < 3) {
                try {
                    setTimeout(() => {
                        if (isRecordingDoctor) {
                            recognitionDoctor.start();
                        }
                    }, 100);
                } catch (e) {
                    stopVoiceInputDoctor();
                }
            } else if (!isRecordingDoctor) {
                stopVoiceInputDoctor();
            }
        };

        try {
            recognitionDoctor.start();
        } catch (error) {
            showToast('无法启动语音识别，请检查麦克风权限');
            stopVoiceInputDoctor();
        }
    }

    function stopVoiceInputDoctor(autoStop = false) {
        if (recognitionTimeoutDoctor) {
            clearTimeout(recognitionTimeoutDoctor);
            recognitionTimeoutDoctor = null;
        }

        isRecordingDoctor = false;

        if (recognitionDoctor) {
            try {
                recognitionDoctor.stop();
            } catch (e) {}
            recognitionDoctor = null;
        }

        const voiceStatus = document.getElementById('voiceStatusDoctor');
        const voiceIcon = document.getElementById('voiceIconDoctor');
        const button = document.getElementById('voiceInputBtnDoctor');
        const doctorQuestion = document.getElementById('doctorQuestion');

        if (button) button.classList.remove('recording');
        if (voiceIcon) voiceIcon.textContent = '🎤';
        if (voiceStatus) voiceStatus.style.display = 'none';

        if (finalTranscriptDoctor && doctorQuestion) {
            const text = finalTranscriptDoctor.trim();
            if (text) {
                doctorQuestion.value = text;
            }
        }

        finalTranscriptDoctor = '';
        interimTranscriptDoctor = '';
        restartAttemptsDoctor = 0;
    }

    // Doctor consultation handler
    async function handleAskDoctorConsultation() {
        const animal = getAnimal();
        const doctorQuestion = document.getElementById('doctorQuestion');
        if (!doctorQuestion) return;

        const question = doctorQuestion.value.trim();
        if (!question) {
            showToast("请输入问题");
            return;
        }

        const answerDiv = document.getElementById('doctorAnswer');
        if (answerDiv) answerDiv.textContent = "医生正在分析...";

        try {
            const response = await fetch("/api/animal/ask-doctor", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    animal_id: animal.id,
                    symptom: question,
                    detail: question
                })
            });

            if (!response.ok) throw new Error("网络错误");

            const data = await response.json();
            const reply = data.reply || "医生暂时无法回答。";

            state.doctorLogs.unshift({
                animalId: animal.id,
                symptom: question,
                detail: question,
                reply: reply,
                source: data.source || "AI医生",
                time: Date.now()
            });

            state.progress.treatments = (state.progress.treatments || 0) + 1;
            state.progress.activities.push({
                type: "doctor",
                animal: animal.id,
                time: Date.now(),
                detail: `咨询了${animal.name}的健康问题`
            });

            saveState();
            render();
        } catch (error) {
            if (answerDiv) answerDiv.textContent = "出错了，请重试。";
            showToast("网络错误，请检查连接");
        }
    }

    // Read doctor answer aloud
    function readDoctorAnswer() {
        const answerDiv = document.getElementById('doctorAnswer');
        if (!answerDiv) return;

        const text = answerDiv.textContent.trim();
        if (!text || text === "医生的诊断建议会显示在这里。") {
            showToast("暂无内容可以朗读");
            return;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();

            const cleanText = cleanTextForReading(text);
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85;
            utterance.pitch = 1.05;
            utterance.volume = 0.95;

            // 优先选择更自然的中文女声
            const voices = window.speechSynthesis.getVoices();
            const preferredVoices = [
                'Microsoft Yunxi Online (Natural) - Chinese (Mainland)',
                'Microsoft Xiaoxiao Online (Natural) - Chinese (Mainland)',
                'Microsoft Yaoyao - Chinese (Mainland)',
                'Xiaoxiao',
                'Yaoyao',
                'Tingting'
            ];

            let selectedVoice = null;
            for (const preferred of preferredVoices) {
                selectedVoice = voices.find(v => v.name.includes(preferred));
                if (selectedVoice) break;
            }

            if (!selectedVoice) {
                selectedVoice = voices.find(v =>
                    v.lang.includes('zh') &&
                    (v.name.includes('Female') || v.name.includes('female'))
                );
            }

            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.includes('zh'));
            }

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showToast("您的浏览器不支持语音朗读");
        }
    }

    // Read QA answer aloud
    function readQaAnswer() {
        const answerDiv = document.getElementById('qaAnswer');
        const iconSpan = document.getElementById('readQaIcon');

        if (!answerDiv) return;

        const text = answerDiv.textContent.trim();
        if (!text) {
            showToast("暂无内容可以朗读");
            return;
        }

        if ('speechSynthesis' in window) {
            // 如果正在播放，则停止
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                if (iconSpan) iconSpan.textContent = '🔊';
                return;
            }

            // 开始播放
            if (iconSpan) iconSpan.textContent = '⏸️';

            const cleanText = cleanTextForReading(text);
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85;
            utterance.pitch = 1.05;
            utterance.volume = 0.95;

            // 优先选择更自然的中文女声
            const voices = window.speechSynthesis.getVoices();
            const preferredVoices = [
                'Microsoft Yunxi Online (Natural) - Chinese (Mainland)',
                'Microsoft Xiaoxiao Online (Natural) - Chinese (Mainland)',
                'Microsoft Yaoyao - Chinese (Mainland)',
                'Xiaoxiao',
                'Yaoyao',
                'Tingting'
            ];

            let selectedVoice = null;
            for (const preferred of preferredVoices) {
                selectedVoice = voices.find(v => v.name.includes(preferred));
                if (selectedVoice) break;
            }

            // 如果没找到偏好的，选择任何包含zh且为女声的
            if (!selectedVoice) {
                selectedVoice = voices.find(v =>
                    v.lang.includes('zh') &&
                    (v.name.includes('Female') || v.name.includes('female'))
                );
            }

            // 最后fallback到任何中文声音
            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.includes('zh'));
            }

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onend = () => {
                if (iconSpan) iconSpan.textContent = '🔊';
            };

            utterance.onerror = () => {
                if (iconSpan) iconSpan.textContent = '🔊';
            };

            window.speechSynthesis.speak(utterance);
        } else {
            showToast("您的浏览器不支持语音朗读");
        }
    }

    function resetProgress() {
        if (!window.confirm("确定要清空所有学习记录吗？\n\n此操作将删除：\n• 所有活动记录\n• 探索进度\n• 测验成绩\n• 生成的故事\n• 想象的动物\n\n此操作不可恢复！")) {
            return;
        }
        const profile = state.profile;
        state = clone(defaultState);
        state.profile = profile;
        saveState();
        render();
        showToast("学习记录已清空");
    }

    function exportData() {
        try {
            const exportData = {
                version: "v3",
                exportTime: new Date().toISOString(),
                profile: state.profile,
                progress: state.progress,
                stories: state.stories,
                creations: state.creations,
                settings: {
                    model: state.model,
                    contentFilter: state.contentFilter,
                    dailyLimit: state.dailyLimit,
                    autoSave: state.autoSave,
                    readSpeed: state.readSpeed
                }
            };

            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);

            const link = document.createElement('a');
            link.href = url;
            const filename = `苹果布丁学习数据_${state.profile.name}_${new Date().toISOString().slice(0, 10)}.json`;
            link.download = filename;
            link.click();

            URL.revokeObjectURL(url);
            showToast("数据已导出");
        } catch (error) {
            console.error("导出数据失败:", error);
            showToast("导出失败，请重试");
        }
    }

    function backToParentPortal() {
        // 返回家长门户
        window.location.href = '/static/parent-portal.html';
    }

    render();
</script>
