<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>动物乐园 AI 问答 Demo</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f4fbff;
            color: #222;
        }

        .container {
            width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #2b7cff;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .animal-list {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .animal-btn {
            border: 2px solid #d8e9ff;
            background: #f7fbff;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        .animal-btn.active {
            background: #2b7cff;
            color: white;
            border-color: #2b7cff;
        }

        .form-row {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccd8e0;
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button.ask-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 18px;
            background: #2b7cff;
            color: white;
            cursor: pointer;
        }

        button.ask-btn:disabled {
            background: #9bbcea;
            cursor: not-allowed;
        }

        .answer-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 14px;
            background: #f1f8ff;
            border-left: 6px solid #2b7cff;
            min-height: 80px;
            line-height: 1.8;
            font-size: 17px;
        }

        .meta {
            margin-top: 10px;
            color: #777;
            font-size: 14px;
        }

        .error {
            color: #d93025;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>动物乐园 AI 问答 Demo</h1>
    <div class="subtitle">选择一个动物，问 AI 一个问题</div>

    <div class="animal-list">
        <button class="animal-btn active" onclick="selectAnimal(this, '熊猫')">熊猫</button>
        <button class="animal-btn" onclick="selectAnimal(this, '小猫')">小猫</button>
        <button class="animal-btn" onclick="selectAnimal(this, '小狗')">小狗</button>
        <button class="animal-btn" onclick="selectAnimal(this, '兔子')">兔子</button>
        <button class="animal-btn" onclick="selectAnimal(this, '海豚')">海豚</button>
        <button class="animal-btn" onclick="selectAnimal(this, '小鸟')">小鸟</button>
    </div>

    <div class="form-row">
        <label>选择模型</label>
        <select id="model">
            <option value="Doubao-Seed-2.0-pro">Doubao-Seed-2.0-pro</option>
            <option value="Doubao-Seed-2.0-mini">Doubao-Seed-2.0-mini</option>
            <option value="Doubao-Seed-2.0-lite">Doubao-Seed-2.0-lite</option>
            <option value="Volc-DeepSeek-V3.2">Volc-DeepSeek-V3.2</option>
            <option value="qwen3.5-plus">qwen3.5-plus</option>
        </select>
    </div>

    <div class="form-row">
        <label>小朋友的问题</label>
        <textarea id="question">熊猫为什么喜欢吃竹子？</textarea>
    </div>

    <button class="ask-btn" id="askBtn" onclick="askAI()">问问 AI</button>

    <div class="answer-box" id="answerBox">
        AI 的回答会显示在这里。
    </div>

    <div class="meta" id="metaBox"></div>
</div>

<script>
    let selectedAnimal = "熊猫";

    function selectAnimal(button, animal) {
        selectedAnimal = animal;

        const buttons = document.querySelectorAll(".animal-btn");
        buttons.forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        const questionBox = document.getElementById("question");
        questionBox.value = animal + "有什么有趣的特点？";
    }

    async function askAI() {
        const question = document.getElementById("question").value.trim();
        const model = document.getElementById("model").value;
        const answerBox = document.getElementById("answerBox");
        const metaBox = document.getElementById("metaBox");
        const askBtn = document.getElementById("askBtn");

        if (!question) {
            answerBox.innerHTML = "<span class='error'>请先输入问题。</span>";
            return;
        }

        askBtn.disabled = true;
        askBtn.innerText = "AI 正在思考...";
        answerBox.innerText = "正在请求 AI，请稍等...";
        metaBox.innerText = "";

        try {
            const response = await fetch("/api/animal/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: question,
                    animal: selectedAnimal,
                    model: model
                })
            });

            const data = await response.json();

            if (data.success) {
                answerBox.innerText = data.reply;
                metaBox.innerText = "当前动物：" + data.animal + "｜使用模型：" + data.model;
            } else {
                answerBox.innerHTML = "<span class='error'>请求失败：" + data.error + "</span>";
                console.log(data);
            }
        } catch (error) {
            answerBox.innerHTML = "<span class='error'>前端请求出错：" + error.message + "</span>";
        } finally {
            askBtn.disabled = false;
            askBtn.innerText = "问问 AI";
        }
    }
</script>
</body>
</html>
