<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3f9a68">
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png">
    <title>苹果布丁 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #dff4ff 0%, #eff9f0 44%, #fff8e3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            overflow-x: hidden;
        }

        /* 手机风格容器 */
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            min-height: 65vh;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 32px 24px 20px;
            background: linear-gradient(135deg, #3f9a68 0%, #4aae78 100%);
            color: white;
            flex-shrink: 0;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            font-size: 40px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(31, 41, 51, 0.14);
        }

        .logo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .role-tabs {
            display: flex;
            gap: 10px;
            padding: 20px 24px 0;
            background: white;
            flex-shrink: 0;
        }

        .role-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 15px;
            font-weight: 500;
            color: #6B7077;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-tab.active {
            color: #3f9a68;
            border-bottom-color: #3f9a68;
        }

        .content {
            padding: 24px 24px 32px;
            background: white;
            flex: 1;
            overflow-y: auto;
        }

        .role-content {
            display: none;
        }

        .role-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            border-bottom: 2px solid #E7E3DA;
        }

        .auth-tab {
            padding: 10px 0;
            font-size: 15px;
            font-weight: 500;
            color: #6B7077;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .auth-tab.active {
            color: #3f9a68;
            border-bottom-color: #3f9a68;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1E2227;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E7E3DA;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3f9a68;
            background: white;
            box-shadow: 0 0 0 3px rgba(63, 154, 104, 0.1);
        }

        .form-group input::placeholder {
            color: #9CA3AF;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3f9a68 0%, #4aae78 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(63, 154, 104, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-top: 16px;
            font-size: 13px;
            color: #6B7077;
        }

        .links a {
            color: #3f9a68;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            white-space: normal;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .message.success {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
        }

        .message.show {
            display: block;
        }

        .settings-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #E7E3DA;
            font-size: 13px;
            color: #6B7077;
        }

        .settings-link a {
            color: #3f9a68;
            text-decoration: none;
            font-weight: 500;
        }

        .settings-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-container {
                border-radius: 20px;
            }

            .header {
                padding: 28px 20px 16px;
            }

            .logo {
                width: 56px;
                height: 56px;
                font-size: 36px;
            }

            .header h1 {
                font-size: 22px;
            }

            .role-tabs {
                padding: 16px 20px 0;
            }

            .content {
                padding: 20px 20px 28px;
            }

            .links {
                justify-content: flex-start;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/styles/handdrawn.css?v=20260705-loginspacing1">
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo"><img src="/static/icon-192.png" alt=""></div>
            <h1>苹果布丁</h1>
            <p>探索动物世界，快乐学习成长</p>
        </div>

        <div class="role-tabs">
            <button class="role-tab active" id="childRoleTab" onclick="switchRole('child')">小探险家</button>
            <button class="role-tab" id="parentRoleTab" onclick="switchRole('parent')">家长</button>
        </div>

        <div class="content">
            <div id="message" class="message"></div>

            <!-- 儿童端 -->
            <div id="childMode" class="role-content active">
                <form id="childLoginForm">
                    <div class="form-group">
                        <label>孩子姓名</label>
                        <input type="text" id="childName" placeholder="请输入孩子姓名" maxlength="12" required>
                    </div>
                    <div class="form-group">
                        <label>进入码</label>
                        <input type="text" id="childEntryCode" placeholder="请输入6位进入码" inputmode="numeric" maxlength="6" required>
                    </div>
                    <button type="submit" class="submit-btn">进入乐园</button>
                </form>

                <div class="settings-link">
                    需要家长先创建孩子账号？<a href="/static/parent-portal.html">前往家长端</a>
                </div>
            </div>

            <!-- 家长端 -->
            <div id="parentMode" class="role-content">

                <div class="auth-tabs">
                    <div class="auth-tab active" data-auth-tab="login" onclick="switchAuthTab('login')">登录</div>
                    <div class="auth-tab" data-auth-tab="register" onclick="switchAuthTab('register')">注册</div>
                </div>

                <!-- 家长登录 -->
                <form id="parentLoginForm" class="form-section active">
                    <div class="form-group">
                        <label>手机号或邮箱</label>
                        <input type="text" id="parentLoginUsername" placeholder="请输入手机号或邮箱" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="parentLoginPassword" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="submit-btn">登录</button>
                    <div class="links">
                        <a onclick="showMessage('忘记密码功能即将推出', 'error')">忘记密码？</a>
                        <a onclick="switchAuthTab('register')">立即注册</a>
                    </div>
                </form>

                <!-- 家长注册 -->
                <form id="parentRegisterForm" class="form-section">
                    <div class="form-group">
                        <label>家长姓名</label>
                        <input type="text" id="parentRegisterName" placeholder="请输入您的姓名" required>
                    </div>
                    <div class="form-group">
                        <label>手机号</label>
                        <input type="tel" id="parentRegisterPhone" placeholder="请输入手机号" pattern="1[3-9]\d{9}" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱（可选）</label>
                        <input type="email" id="parentRegisterEmail" placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>设置密码</label>
                        <input type="password" id="parentRegisterPassword" placeholder="8-20位密码" minlength="8" maxlength="20" required>
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="parentRegisterConfirm" placeholder="再次输入密码" required>
                    </div>
                    <button type="submit" class="submit-btn">注册</button>
                    <div class="links">
                        <a onclick="switchAuthTab('login')">已有账号？立即登录</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'child';

        // 页面加载检查登录状态和角色
        window.addEventListener('DOMContentLoaded', () => {
            // 检查 URL 参数，如果有 role=parent，自动切换到家长选项卡
            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');

            if (roleParam === 'parent') {
                switchRole('parent');
            }

            // 检查是否已登录家长账号
            const token = localStorage.getItem('parentToken');
            if (token && currentRole === 'parent') {
                window.location.href = '/static/parent-portal.html';
            }

            // 绑定儿童端登录表单
            const childLoginForm = document.getElementById('childLoginForm');
            if (childLoginForm) {
                childLoginForm.addEventListener('submit', handleChildLogin);
            }

            // 绑定家长登录表单
            const parentLoginForm = document.getElementById('parentLoginForm');
            if (parentLoginForm) {
                parentLoginForm.addEventListener('submit', handleParentLogin);
            }

            // 绑定家长注册表单
            const parentRegisterForm = document.getElementById('parentRegisterForm');
            if (parentRegisterForm) {
                parentRegisterForm.addEventListener('submit', handleParentRegister);
            }
        });

        // 切换角色（儿童/家长）
        function switchRole(role) {
            currentRole = role;

            document.querySelectorAll('.role-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(role + 'RoleTab').classList.add('active');

            document.querySelectorAll('.role-content').forEach(content => content.classList.remove('active'));
            document.getElementById(role + 'Mode').classList.add('active');

            hideMessage();
        }

        // 切换认证标签（登录/注册）
        function switchAuthTab(authType) {
            document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
            const targetTab = document.querySelector(`.auth-tab[data-auth-tab="${authType}"]`);
            if (targetTab) {
                targetTab.classList.add('active');
            }

            document.querySelectorAll('#parentMode .form-section').forEach(section => section.classList.remove('active'));
            document.getElementById('parent' + authType.charAt(0).toUpperCase() + authType.slice(1) + 'Form').classList.add('active');

            hideMessage();
        }

        // 显示消息
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type + ' show';
            setTimeout(() => hideMessage(), 5000);
        }

        function hideMessage() {
            document.getElementById('message').className = 'message';
        }

        function buildChildProgressSnapshot(child) {
            if (child.synced_progress && typeof child.synced_progress === 'object' && Object.keys(child.synced_progress).length) {
                return {
                    visits: {},
                    questions: 0,
                    doctorChecks: 0,
                    feedings: 0,
                    treatments: 0,
                    quizCorrect: 0,
                    quizTotal: 0,
                    stories: 0,
                    creations: 0,
                    activities: [],
                    totalChats: 0,
                    totalQuestions: 0,
                    totalQuizPassed: 0,
                    totalStories: 0,
                    storiesCompleted: 0,
                    uniqueAnimalsInteracted: [],
                    ...child.synced_progress,
                    visits: { ...(child.synced_progress.visits || {}) },
                    activities: Array.isArray(child.synced_progress.activities) ? child.synced_progress.activities : []
                };
            }

            return {
                visits: Object.fromEntries((child.animals_explored || []).map(animalId => [animalId, 1])),
                questions: 0,
                doctorChecks: 0,
                feedings: 0,
                treatments: 0,
                quizCorrect: child.questions_correct || 0,
                quizTotal: child.questions_answered || 0,
                stories: child.stories_created || 0,
                creations: 0,
                activities: [],
                totalChats: 0,
                totalQuestions: 0,
                totalQuizPassed: 0,
                totalStories: 0,
                storiesCompleted: 0,
                uniqueAnimalsInteracted: []
            };
        }

        async function handleChildLogin(e) {
            e.preventDefault();
            hideMessage();

            const name = document.getElementById('childName').value.trim();
            const entryCode = document.getElementById('childEntryCode').value.trim();

            if (!name || !entryCode) {
                showMessage('请输入孩子姓名和进入码', 'error');
                return;
            }

            if (!/^\d{6}$/.test(entryCode)) {
                showMessage('请输入6位进入码', 'error');
                return;
            }

            try {
                const response = await fetch('/api/family/child-access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        entry_code: entryCode
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    const child = data.child;
                    const sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    const progressSnapshot = buildChildProgressSnapshot(child);
                    const syncedCreationsCount = Number(child.synced_creations_count || progressSnapshot.creations || 0) || 0;

                    const sessionData = {
                        sessionId: sessionId,
                        profile: {
                            name: child.name,
                            age: Number(child.age) || 6,
                            role: 'child'
                        },
                        progress: progressSnapshot,
                        selectedAnimalId: null,
                        creations: Array.from({ length: syncedCreationsCount }, (_, index) => ({
                            id: `synced-creation-${index + 1}`,
                            synced: true
                        })),
                        route: 'map',
                        linkedAccountId: data.account_id,
                        linkedChildId: child.id,
                        linkedChildProfile: child,
                        syncToken: data.sync_token,
                        lastSyncedAt: child.last_synced_at || new Date().toISOString()
                    };

                    const storeKey = 'applePuddingAnimalSessionsV3';
                    const activeSessionKey = 'applePuddingActiveSessionId';
                    let sessionStore = { sessions: {}, order: [] };

                    try {
                        const saved = localStorage.getItem(storeKey);
                        if (saved) {
                            sessionStore = JSON.parse(saved);
                        }
                    } catch (loadError) {
                        console.error('Failed to load sessions:', loadError);
                    }

                    sessionStore.sessions[sessionId] = sessionData;
                    sessionStore.order = [sessionId, ...sessionStore.order.filter(id => id !== sessionId)];
                    localStorage.setItem(storeKey, JSON.stringify(sessionStore));
                    sessionStorage.setItem(activeSessionKey, sessionId);
                    window.location.href = '/static/index.html?v=20260705-syncfix4';
                } else {
                    showMessage(data.detail || data.message || '进入失败，请检查姓名和进入码', 'error');
                }
            } catch (error) {
                console.error('孩子进入失败:', error);
                showMessage('进入失败，请稍后重试', 'error');
            }
        }

        // 家长登录处理
        async function handleParentLogin(e) {
            e.preventDefault();
            hideMessage();

            const username = document.getElementById('parentLoginUsername').value.trim();
            const password = document.getElementById('parentLoginPassword').value;

            if (!username || !password) {
                showMessage('请填写完整信息', 'error');
                return;
            }

            try {
                const response = await fetch('/api/family/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('parentToken', data.token);
                    localStorage.setItem('parentAccount', JSON.stringify(data.account));
                    showMessage('登录成功！正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = '/static/parent-portal.html';
                    }, 1000);
                } else {
                    showMessage(data.detail || data.message || '登录失败，请检查账号密码', 'error');
                }
            } catch (error) {
                console.error('登录失败:', error);
                showMessage('登录失败，请稍后重试', 'error');
            }
        }

        // 家长注册处理
        async function handleParentRegister(e) {
            e.preventDefault();
            hideMessage();

            const name = document.getElementById('parentRegisterName').value.trim();
            const phone = document.getElementById('parentRegisterPhone').value.trim();
            const email = document.getElementById('parentRegisterEmail').value.trim();
            const password = document.getElementById('parentRegisterPassword').value;
            const confirmPassword = document.getElementById('parentRegisterConfirm').value;

            // 验证
            if (!name || !phone || !password) {
                showMessage('请填写必填项', 'error');
                return;
            }

            if (password.length < 8 || password.length > 20) {
                showMessage('密码长度应为8-20位', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('两次密码不一致', 'error');
                return;
            }

            // 简单的手机号验证
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showMessage('请输入有效的手机号', 'error');
                return;
            }

            try {
                const response = await fetch('/api/family/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        parent_name: name,
                        phone: phone,
                        email: email || null,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('注册成功！正在跳转到登录...', 'success');
                    setTimeout(() => {
                        switchAuthTab('login');
                        // 预填手机号
                        document.getElementById('parentLoginUsername').value = phone;
                    }, 1500);
                } else {
                    const errorMessage = data.detail || data.message || data.error || '注册失败';
                    showMessage(
                        errorMessage.includes('Rate limit exceeded')
                            ? '注册过于频繁，请 1 小时后再试'
                            : errorMessage,
                        'error'
                    );
                }
            } catch (error) {
                console.error('注册失败:', error);
                showMessage('注册失败，请稍后重试', 'error');
            }
        }
    </script>
</body>
</html>
