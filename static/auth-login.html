<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3f9a68">
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png">
    <title>苹果布丁动物乐园 - 登录</title>
    <style>
        :root {
            --bg: #F7F5F1;
            --surface: #FFFFFF;
            --border: #E7E3DA;
            --ink: #1E2227;
            --muted: #6B7077;
            --accent: #3C5A78;
            --accent-hover: #2E4760;
            --green: #3f9a68;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(180deg, #dff4ff 0%, #eff9f0 44%, #fff8e3 100%);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 88px;
            height: 88px;
            margin-bottom: 16px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 20px;
            overflow: hidden;
            background: #fffdf7;
            box-shadow: 0 8px 22px rgba(31, 41, 51, 0.12);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--ink);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.primary {
            background: var(--accent);
            color: white;
        }

        button.primary:hover {
            background: var(--accent-hover);
        }

        button.secondary {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border);
        }

        button.secondary:hover {
            background: var(--border);
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .toggle-form a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-message {
            background: #efe;
            border: 1px solid #cfc;
            color: #383;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="/static/styles/handdrawn.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon"><img src="/static/icon-192.png" alt=""></div>
            <h1>苹果布丁动物乐园</h1>
            <p class="subtitle">家长登录后可为孩子创建专属账号</p>
        </div>

        <div id="errorMessage" class="error-message hidden"></div>
        <div id="successMessage" class="success-message hidden"></div>

        <!-- 登录表单 -->
        <form id="loginForm">
            <div class="form-group">
                <label>手机号或邮箱</label>
                <input type="text" id="loginUsername" placeholder="请输入手机号或邮箱" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="primary">登录</button>
            </div>
            <div class="toggle-form">
                还没有账号？<a onclick="showRegisterForm()">立即注册</a>
            </div>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>家长姓名</label>
                <input type="text" id="registerName" placeholder="请输入您的姓名" required>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="registerPhone" placeholder="请输入手机号" required>
            </div>
            <div class="form-group">
                <label>邮箱（可选）</label>
                <input type="email" id="registerEmail" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label>设置密码</label>
                <input type="password" id="registerPassword" placeholder="8-20位密码" required minlength="8" maxlength="20">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="registerConfirmPassword" placeholder="再次输入密码" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="primary">注册</button>
            </div>
            <div class="toggle-form">
                已有账号？<a onclick="showLoginForm()">立即登录</a>
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // 检查是否已登录
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('parentToken');
            if (token) {
                // 已登录，跳转到家长端
                window.location.href = '/static/parent-portal.html';
            }
        });

        function showLoginForm() {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            clearMessages();
        }

        function showRegisterForm() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            clearMessages();
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function clearMessages() {
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        }

        // 登录处理
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('请填写完整信息');
                return;
            }

            try {
                const response = await fetch('/api/family/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('parentToken', data.token);
                    localStorage.setItem('parentAccount', JSON.stringify(data.account));
                    showSuccess('登录成功！正在跳转...');
                    setTimeout(() => {
                        window.location.href = '/static/parent-portal.html';
                    }, 1000);
                } else {
                    showError(data.detail || data.message || '登录失败，请检查账号密码');
                }
            } catch (error) {
                console.error('登录失败:', error);
                showError('登录失败，请稍后重试');
            }
        });

        // 注册处理
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const name = document.getElementById('registerName').value.trim();
            const phone = document.getElementById('registerPhone').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            // 验证
            if (!name || !phone || !password) {
                showError('请填写完整信息');
                return;
            }

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showError('请输入正确的手机号');
                return;
            }

            if (password.length < 8) {
                showError('密码至少8位');
                return;
            }

            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            try {
                const response = await fetch('/api/family/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        parent_name: name,
                        phone: phone,
                        email: email || null,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('parentToken', data.token);
                    localStorage.setItem('parentAccount', JSON.stringify(data.account));
                    showSuccess('注册成功！正在跳转...');
                    setTimeout(() => {
                        window.location.href = '/static/parent-portal.html';
                    }, 1000);
                } else {
                    showError(data.detail || data.message || '注册失败，请稍后重试');
                }
            } catch (error) {
                console.error('注册失败:', error);
                showError('注册失败，请稍后重试');
            }
        });
    </script>
</body>
</html>
